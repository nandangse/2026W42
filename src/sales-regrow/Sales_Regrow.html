<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Regrow · Nandan GSE Sales Strategy Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A5E;--ink:#0E1730;--orange:#F04E23;--steel:#EDEFF5;--line:#D5DAE7;--slate:#5B6785;--wash:#FAFBFD;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:#fff;color:var(--ink);font-size:15px;line-height:1.62;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:11px 22px;flex-wrap:wrap}
.logo{height:32px;background:#fff}
.titleblock{border-left:2px solid var(--line);padding-left:15px;line-height:1.12}
.titleblock h1{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.titleblock h1 em{font-style:normal;color:var(--orange)}
.titleblock span{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--slate)}
.spacer{flex:1}
.confbadge{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;background:var(--orange);color:#fff;padding:5px 10px;white-space:nowrap}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
nav.tabs{display:flex;overflow-x:auto;background:var(--navy);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.66);background:none;border:0;border-bottom:3px solid transparent;padding:12px 19px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--orange)}
.wrap{display:grid;grid-template-columns:250px 1fr;max-width:1420px;margin:0 auto;min-height:70vh}
.subnav{border-right:1px solid var(--line);padding:26px 0 60px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
.subnav .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--slate);padding:0 22px 11px}
.subnav a{display:block;padding:8px 22px;font-size:13.5px;color:var(--slate);text-decoration:none;border-left:2px solid transparent;transition:.12s}
.subnav a:hover{color:var(--navy);background:var(--steel)}
.subnav a.active{color:var(--navy);font-weight:600;border-left-color:var(--orange);background:var(--steel)}
main{padding:34px 44px 110px;min-width:0}
.panel{display:none}.panel.on{display:block}
section.sec{padding-bottom:44px;margin-bottom:36px;border-bottom:1px solid var(--line);scroll-margin-top:130px}
section.sec:last-child{border-bottom:0}
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:9px}
h2{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);line-height:1.05;margin-bottom:14px}
h3{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.045em;text-transform:uppercase;color:var(--navy);margin:26px 0 10px}
h4{font-size:13.5px;font-weight:700;margin:17px 0 6px}
p{margin-bottom:13px;max-width:76ch}
ul,ol{margin:0 0 15px 19px;max-width:76ch}li{margin-bottom:6px}
strong,b{color:var(--navy)}
.lead{font-size:17px;color:var(--slate);max-width:70ch;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:18px}
.card{border:1px solid var(--line);padding:17px 18px}
.card .n{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--orange);text-transform:uppercase;display:block;margin-bottom:7px}
.card h4{margin:0 0 6px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.card p{font-size:13px;margin:0;color:var(--slate)}
table{border-collapse:collapse;width:100%;margin:8px 0 20px;font-size:13px}
th{background:var(--navy);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;text-align:left;padding:9px 11px;font-weight:500}
td{border-bottom:1px solid var(--line);padding:9px 11px;vertical-align:top}
tr:nth-child(even) td{background:var(--wash)}
.chip{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:3px 8px;margin:0 5px 5px 0;border:1px solid var(--line);color:var(--slate)}
.chip.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.hot{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip.tbc{border-color:var(--orange);color:var(--orange)}
.note{border-left:3px solid var(--orange);background:var(--steel);padding:14px 17px;margin:16px 0;font-size:13.5px}
.note b{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:5px}
.note.src{border-left-color:var(--navy);background:var(--wash)}
.note.src b{color:var(--navy)}
.rail{position:relative;margin:26px 0 10px;padding-left:58px}
.rail::before{content:"";position:absolute;left:20px;top:6px;bottom:6px;width:2px;background:var(--line)}
.stage{position:relative;padding:0 0 28px}
.stage::before{content:attr(data-n);position:absolute;left:-58px;top:0;width:40px;height:40px;background:var(--navy);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.stage.gate::before{background:var(--orange)}
.stage h4{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:8px 0 4px}
.stage .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.stage .crit{font-size:13px;color:var(--slate);border-left:2px solid var(--line);padding-left:13px;margin-top:9px}
.stage .crit b{font-size:12px}
.metric{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 6px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric div{min-width:92px}
.metric .v{font-family:var(--display);font-size:31px;font-weight:700;color:var(--navy);line-height:1}
.metric .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-top:4px}
.opsp{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));border:1px solid var(--navy);margin:20px 0}
.opsp>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 16px}
.opsp .hd{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:8px}
.opsp p{font-size:13px;margin:0 0 7px}
.opsp ul{margin:0 0 0 16px;font-size:13px}
.acr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);margin:14px 0 20px}
.acr div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 12px;font-size:13px}
.acr b{font-family:var(--display);font-size:20px;color:var(--orange);margin-right:8px}
.qg{border:1px solid var(--navy);margin:20px 0}
.qghd{background:var(--navy);color:#fff;padding:11px 16px;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.qgbody{display:grid;grid-template-columns:1fr 1fr}
.qgin{padding:18px 20px;border-right:1px solid var(--line)}
.qgout{padding:18px 20px;background:var(--wash)}
.fld{margin-bottom:12px}
.fld label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;font-family:var(--body);font-size:13.5px;padding:7px 9px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0}
.fld textarea{resize:vertical;min-height:52px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.qgsub{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin:18px 0 9px;padding-top:12px;border-top:1px solid var(--line)}
.qgsub:first-child{border-top:0;padding-top:0;margin-top:0}
.qline{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.qline.tot{border-bottom:0;border-top:2px solid var(--navy);margin-top:6px;padding-top:9px;font-family:var(--display);font-size:21px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);font-weight:700}
.qline span:last-child{font-family:var(--mono);white-space:nowrap}
.words{font-family:var(--mono);font-size:11px;color:var(--orange);letter-spacing:.06em;margin-top:5px;text-align:right}
.flag{font-size:12px;padding:7px 10px;border-left:3px solid var(--orange);background:#fff;margin-bottom:6px}
.flag.ok{border-left-color:var(--navy);color:var(--slate)}
#wm{position:fixed;inset:0;z-index:900;pointer-events:none;opacity:.055;background-repeat:repeat;transform:rotate(-24deg) scale(1.5)}
#shield{position:fixed;inset:0;z-index:950;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center;padding:30px}
#shield.on{display:flex}
#shield .sh1{font-family:var(--display);font-size:28px;letter-spacing:.09em;text-transform:uppercase}
#shield .sh2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.75);text-transform:uppercase}
footer{border-top:1px solid var(--line);padding:20px 44px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--slate);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media (max-width:980px){.qgbody{grid-template-columns:1fr}.qgin{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:900px){
 .wrap{grid-template-columns:1fr}
 .subnav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:4px;overflow-x:auto}
 .subnav .eyebrow{display:none}
 .subnav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:6px 15px}
 .subnav a.active{border-left:0;border-bottom-color:var(--orange)}
 main{padding:24px 20px 90px}h2{font-size:27px}
 .bar{padding:10px 16px;gap:11px}footer{padding:18px 20px}
 .f2,.f3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media print{body>*{display:none!important}
 body::after{content:"Printing and PDF export are disabled. Sales Regrow — Nandan GSE Confidential.";font-family:sans-serif;font-size:15px;display:block;padding:40px}}
</style>
</head>

/* ============ OUR OPSP ============ */
{id:"opsp",tab:"Our OPSP",secs:[
 {id:"o-plan",kicker:"OPSP 2026-27",h2:"Breakthrough 2027",
  html:`<p style="font-family:var(--display);font-size:30px;letter-spacing:.03em;text-transform:uppercase;color:var(--orange);line-height:1.1;max-width:30ch;margin-bottom:6px">One team.<br>Every promise kept.</p>
  <p class="lead">Safe work. On-time delivery. Right the first time. This is the year Nandan becomes the company we know it can be. <b>Building today. Leading tomorrow.</b></p>
  <div class="opsp">
   <div><span class="hd">Purpose — the why</span><p>To build serious machines that make dangerous work safe — and to prove that an Indian company can do it well enough that the world comes to us first.</p></div>
   <div><span class="hd">Mission</span><p>We design and build mission-critical lifting and support systems for customers who cannot afford failure. We improve our customers' productivity, performance and safety by helping them save money, time and effort. We are known for our quality, reliability and after-sales service.</p></div>
   <div><span class="hd">BHAG — by 2029</span><p>A <b>Rs. 350 Cr</b> engineering institution where half our revenue comes from <b>65 countries</b> — the Indian choice for the world's aviation and defence operators.</p><p>Listed, professionally led, running on systems rather than on any one person. The benchmark in India for safety, first-time-right quality, and delivery you can set your watch by. Work made safer for more than <b>2 million people</b> across <b>1,000+ customers</b>.</p></div>
   <div><span class="hd">Brand promise — what we will not settle on</span><ul><li>Innovation · quality and reliability</li><li>Meet or exceed safety standards</li><li>Customised solutions and consultative selling</li><li>Sustainable lean practices</li><li>Fantastic after-sales service</li></ul></div>
   <div><span class="hd">This year — the mission for 2026-27</span><p><b>Rs. 100 Cr at 10% PBT by 31 March 2027.</b> A stabilised, optimised company with profitable revenue streams and teams executing smoothly. Exports at Rs. 50 Cr — half the business. The founder out of daily operations.</p></div>
   <div><span class="hd">Critical numbers</span><p><b>OTIF</b> from below 60% to 95%. <b>40% gross margin</b> enforced at quote stage. <b>Working capital under 30 days.</b> Everything else supports these three.</p></div>
  </div>
  <h3>The Nandan Oath</h3>
  <div class="grid">
   <div class="card"><span class="n">01</span><h4>Deliver predictably</h4><p>When Nandan commits, Nandan delivers.</p></div>
   <div class="card"><span class="n">02</span><h4>Build quality right first time</h4><p>Prevention over inspection — always.</p></div>
   <div class="card"><span class="n">03</span><h4>Use resources wisely</h4><p>Value from every rupee and every hour.</p></div>
   <div class="card"><span class="n">04</span><h4>Solve root causes</h4><p>Never the same problem twice.</p></div>
   <div class="card"><span class="n">05</span><h4>Build systems, develop leaders</h4><p>Not dependence on heroics.</p></div>
   <div class="card"><span class="n">06</span><h4>Grow profitably</h4><p>Never chase revenue at any cost.</p></div>
  </div>
  <div class="note"><b>What this means for sales</b>Three lines of the OPSP land directly on this team. <b>Margin Fortress</b> — 40% gross margin is enforced at the quote, not reviewed after the fact. <b>Delivery Spine</b> — we quote the honest date; trust is the raw material of the order book. <b>Export Engine</b> — half of revenue, Rs. 50 Cr, from exports. Every page on this site should be read against those three.</div>`},

 {id:"o-values",kicker:"REALISTICS",h2:"Our core values",
  html:`<p class="lead">Ten values, one acronym. This is now the single set — the alternative lists that were circulating in the old playbook are superseded.</p>
  <table><tr><th></th><th>Value</th><th>What it means</th></tr>
  <tr><td><b>R</b></td><td><b>Responsiveness</b></td><td>We react quickly and positively to every situation, even if in the negation</td></tr>
  <tr><td><b>E</b></td><td><b>Excellence</b></td><td>We are extremely good on our quality and be outstanding in all aspects</td></tr>
  <tr><td><b>A</b></td><td><b>Accountability</b></td><td>We are acceptable for honest and ethical conduct to what is assigned to us as responsibility</td></tr>
  <tr><td><b>L</b></td><td><b>Lean</b></td><td>We work to eliminate all waste so that we add value in every step and every process</td></tr>
  <tr><td><b>I</b></td><td><b>Innovation</b></td><td>We are always innovating new thoughts and ideas for the value addition for the customer</td></tr>
  <tr><td><b>S</b></td><td><b>Speed</b></td><td>We work at the Nandan Speed on ideas and action</td></tr>
  <tr><td><b>T</b></td><td><b>Trust</b></td><td>We work with full trust with each other and never let this break</td></tr>
  <tr><td><b>I</b></td><td><b>Integrity</b></td><td>We say what we will do and actually do what we said without fail</td></tr>
  <tr><td><b>C</b></td><td><b>Continual improvement</b></td><td>We always look to make small changes on a day-to-day basis so we can improve value</td></tr>
  <tr><td><b>S</b></td><td><b>Safety · Quality · On-time · Happiness</b></td><td>We work with the four magic words that guide us towards our goals</td></tr></table>
  <h3>How we live it</h3>
  <ul><li>Weekly assembly and town halls with the team, so everyone knows what they have done and how they have done on continuous learning</li>
  <li>Relentless tracking of all metrics on ERP dashboards</li>
  <li>Continuous Kaizen initiatives for lean deployment on the Gemba, with constant reduction of wastes</li>
  <li>An accountable culture with SLAs defined for everything</li>
  <li>Speed of implementation constantly challenged by cross-functional team meetings and actions</li></ul>`},

 {id:"o-drivers",kicker:"Three-year drivers",h2:"The six engines",
  html:`<p class="lead">Six drivers carry us from here to the 2029 BHAG. Two of them are owned by sales outright, and a third is set at the quote.</p>
  <div class="grid">
   <div class="card"><span class="n">Driver 01</span><h4>Delivery spine</h4><p>Predictable delivery before anything else. Planning gates, one owner per project, OTIF from below 60% to 95%. <b>Trust is the raw material of the order book.</b></p></div>
   <div class="card"><span class="n">Driver 02</span><h4>Margin fortress</h4><p>40% gross margin enforced <i>at quote stage</i>, not reviewed after the fact. Purchase managed as margin protection. Platformisation so repeatability protects the margin instead of heroics.</p></div>
   <div class="card"><span class="n">Driver 03</span><h4>Export engine</h4><p>Half our revenue will be exports. Structured distributors in three focus geographies, two anchor customers, and one flagship platform built for the world rather than for one buyer.</p></div>
   <div class="card"><span class="n">Driver 04</span><h4>Leadership depth</h4><p>Accountable teams that own outcomes. Every key position with a named successor. The measure is simple: the business runs, and improves, when the founder is not in the room.</p></div>
   <div class="card"><span class="n">Driver 05</span><h4>Cash discipline</h4><p>Working capital under 30 days. Rolling 13-week forecast. Every rupee of throughput above the floor is profit that funds the next move, not a number in a review deck.</p></div>
   <div class="card"><span class="n">Driver 06</span><h4>Technology edge</h4><p>ERP as the single source of truth, AI in every function, and electrification on the product roadmap — so we compete on capability, not on effort.</p></div>
  </div>
  <h3>Three-year targets</h3>
  <table><tr><th>Target</th><th>What it means</th></tr>
  <tr><td><b>1,000+ customers with repeat business</b></td><td>Strong retention and referrals by delivering consistent value at scale</td></tr>
  <tr><td><b>95% OTIF, sustained</b></td><td>Not achieved once. Held for four consecutive quarters, until a Nandan date means something in the market.</td></tr>
  <tr><td><b>A 250-person institution</b></td><td>Attrition under 15%. PLI for every employee. ESOP for the next line of leaders.</td></tr>
  <tr><td><b>Top-tier certifications, held</b></td><td>ISO 3834, EN 1090, AS9100D, DGCA — maintained and audit-ready. In defence and aviation these are the entry ticket, not the trophy.</td></tr>
  <tr><td><b>Zero founder dependency</b></td><td>Operations run entirely by a professional leadership team. Every key role with a named successor and a development plan.</td></tr>
  <tr><td><b>Rs. 1,000 Cr+ enterprise valuation</b></td><td>Through EBITDA strength, strategic partnerships and global relevance</td></tr></table>
  <h3>The visioning blocks</h3>
  <table><tr><th>2027</th><th>2028</th><th>2031</th></tr>
  <tr><td>Rs. 100 Cr — stabilised and optimised, profitable revenue streams, 10% PBT, teams executing smoothly. <b>Exports at Rs. 50 Cr, half the business. The founder out of daily operations.</b></td>
  <td>Rs. 200 Cr+, presence across 40+ countries, platformised products, and a professional leadership team running the business without founder intervention.</td>
  <td>Rs. 350 Cr at 15% PBT. A listed-ready entity with robust systems, automation, an innovation lab, 50% export revenue across 65 countries, 250 professionals, and Raghu as Chairman.</td></tr></table>`},

 {id:"o-csf",kicker:"Breakthrough 2027",h2:"Ten critical success factors",
  html:`<p class="lead">The year we stop firefighting and start finishing. Each factor carries its own KPI — four of the ten are wholly or partly sales-owned.</p>
  <table><tr><th>#</th><th>Factor</th><th>KPI</th></tr>
  <tr><td>1</td><td><b>Safety first</b> — zero compromise on safety in every activity. A preventive culture with PPE discipline, induction training and visible safety ownership.</td><td>PPE non-compliance, induction completion, safety observations</td></tr>
  <tr><td>2</td><td><b>On-time delivery</b> — predict and achieve project delivery with 90%+ OTD performance. Drive execution through milestone tracking, accountability and disciplined follow-up.</td><td>OTD %, milestone adherence, delayed-project count</td></tr>
  <tr><td>3</td><td><b>Customer responsiveness</b> <span class="chip hot">Sales</span> — every customer interaction must feel special, timely and professional. No customer should need repeated reminders to get a response.</td><td>Customer reminders, response time, closure time</td></tr>
  <tr><td>4</td><td><b>Deep project planning</b> — plan every project deeply from start to finish. TDS, design, sign-off, review, and execution milestones must all be time-bound.</td><td>Planning completeness, milestone closure, variance to plan</td></tr>
  <tr><td>5</td><td><b>Supplier &amp; material excellence</b> — improve material cost competitiveness through stronger supplier management, new supplier development, and better commercial terms.</td><td>Supplier visits, new suppliers onboarded, purchase % of sales</td></tr>
  <tr><td>6</td><td><b>First-time-right quality</b> — raise fabrication and production quality by building process discipline, training and quality ownership into everyday work.</td><td>Training hours, NC count, rework %, rejection rate</td></tr>
  <tr><td>7</td><td><b>Team strengthening</b> — add critical capability across sales, PPC, quality, purchase, stores, production, safety, process and shopfloor roles to support scale.</td><td>Critical hires closed, team capacity, skill coverage</td></tr>
  <tr><td>8</td><td><b>AI-enabled sales</b> <span class="chip hot">Sales</span> — use AI to improve prospecting, research, communication, follow-up quality, and speed in the sales process.</td><td>Prospects reached, response quality, qualified opportunities</td></tr>
  <tr><td>9</td><td><b>Disciplined shopfloor &amp; night shift</b> — run the factory with better daily discipline and make the night shift operate properly every day with clear ownership and control.</td><td>Night-shift uptime, output, attendance, supervision</td></tr>
  <tr><td>10</td><td><b>Checklist-based delivery &amp; handover</b> <span class="chip hot">Sales</span> — before dispatch, every project must pass a proper checklist on delivery, handover, and customer experience, are consistently A1.</td><td>Dispatch checklist completion, installation readiness, customer satisfaction</td></tr></table>
  <h3>The mission for 2026-27 — ten objectives</h3>
  <table><tr><th>Objective</th><th>By</th></tr>
  <tr><td><b>Rs. 100 Cr at 10% PBT</b></td><td>31 Mar 2027</td></tr>
  <tr><td>Improve EBITDA margin to <b>≥18%</b></td><td>Mar 2027</td></tr>
  <tr><td>Achieve <b>100% project and job tracking</b> in NandanERP</td><td>—</td></tr>
  <tr><td>Reduce working capital cycle to <b>&lt;30 days</b></td><td>Mar 2027</td></tr>
  <tr><td><b>Standardise 45%</b> of the product portfolio</td><td>—</td></tr>
  <tr><td>Export order execution excellence — <b>90% customer satisfaction</b></td><td>—</td></tr>
  <tr><td>Institutionalise weekly execution reviews with <b>100% functional usage</b></td><td>—</td></tr>
  <tr><td>Role clarity, growth paths and upskilling for <b>100% of key staff</b></td><td>Sept 2026</td></tr>
  <tr><td>Operationalise <b>AI across 5 core use cases</b> — sales, marketing, purchase, project management, decision support</td><td>Dec 2026</td></tr></table>
  <div class="note"><b>We pledge</b>Every person goes home safe. Every date we give, we keep. Every job is right the first time. Every customer hears from us before they have to ask. Design plans it properly. Purchase brings it in on time. The floor builds it right. Quality proves it. Service stands behind it. <b>No department wins alone — a project is only as strong as its weakest gate.</b></div>`},

 {id:"o-meet",kicker:"Rhythm",h2:"The strategic meetings tracker",
  html:`<p class="lead">Twelve standing forums. The sales cadence in <b>Metrics → The review cadence</b> sits inside this, not alongside it.</p>
  <table><tr><th>Weekly</th><th>Daily / fortnightly</th><th>Monthly / quarterly</th></tr>
  <tr><td>Weekly Monday Morning Assembly</td><td>Daily Tool Talk</td><td>Monday PRE Meeting</td></tr>
  <tr><td>Weekly Leader Parking Lot</td><td>Fortnightly Leaders Council</td><td>Monthly Reviews — MRM</td></tr>
  <tr><td>Design Reviews</td><td>Stratcom Meeting</td><td>Quarterly Goals Meeting</td></tr>
  <tr><td>1-2-1 Meetings</td><td>WCM Gemba Walk</td><td>Individual Development Plan (IDP)</td></tr></table>
  <div class="note"><b>One reconciliation needed</b>The sales process defines a Monday sales meeting chaired by Nitu, a monthly business review and a quarterly review. The OPSP defines a Monday Morning Assembly, a Monday PRE Meeting, an MRM and a Quarterly Goals Meeting. These are almost certainly the same forums under two names. Map them once, so nobody attends two versions of the same meeting. <span class="chip tbc">To map</span></div>`}
]},

{id:"plan",tab:"Our Sales Plan",secs:[
 {id:"p-field",kicker:"The playing field",h2:"Who we are playing for",
  html:`<p class="lead">From the Game Plan for Breakthrough 2027. This is the definition of a Nandan customer — use it at Gate 1, not as background reading.</p>
  <h3>Our target audience</h3>
  <ul><li>Defence PSU / DRDO / DPSU procurement heads and programme managers</li>
  <li>Airline ground support procurement and ground handling companies</li>
  <li>Flight kitchen CXOs and catering operators at major airports</li>
  <li>EPC contractors for industrial projects</li>
  <li>Large industry groups in other countries</li>
  <li>Supply chain managers in the EU and US</li>
  <li>Aviation OEMs and MRO operators</li>
  <li><b>Export distributors and channel partners — the Rs. 50 Cr engine</b></li></ul>
  <h3>Geography we choose to serve</h3>
  <p><span class="chip go">All India — West, North, East, North East, South</span><span class="chip">Middle East — Saudi, UAE, Bahrain, Oman, Qatar, Kuwait, Israel, Iran</span><span class="chip">Africa — whole of Africa</span><span class="chip">Asia except China — Malaysia, Singapore, Indonesia, Taiwan</span><span class="chip">SAARC</span><span class="chip go">Europe — UK, France, Germany, Switzerland, Spain, East Europe</span><span class="chip">South America — Peru, Brazil, Mexico</span><span class="chip">Australia and USA</span></p>
  <h3>The attributes that make a target a target</h3>
  <ul><li>Safety and quality focused — failure is a mission risk, not an inconvenience</li>
  <li>Value engineering focused — not cheapest, not most expensive</li>
  <li>High compliance requirements — ISO, DGCA, MIL standards, AS9100D</li>
  <li>Procurement process-driven with tendering cycles</li>
  <li>Looking for end-to-end solutions: design, build, maintain</li>
  <li>Prefers a proven track record in defence and aviation</li>
  <li>Gives weightage to infrastructure</li>
  <li>Accepts milestone-based payment structures</li>
  <li>Has repeat or multi-location deployment potential</li>
  <li>Has an internal technical team capable of evaluating engineered systems</li></ul>
  <div class="note"><b>Use this as the disqualifier</b>An enquiry that matches none of these attributes is not a small opportunity — it is the wrong opportunity, and the process says regret it at Gate 1.</div>`},

 {id:"p-uvp",kicker:"Our UVP",h2:"What we say, and why they buy",
  html:`<p style="font-family:var(--display);font-size:30px;letter-spacing:.03em;text-transform:uppercase;color:var(--orange);line-height:1.1;max-width:28ch;margin-bottom:12px">We help to make the world a safer place.</p>
  <p>We elevate the operational efficiency of organisations with innovative material handling solutions that enhance productivity, performance and safety — helping them save time, money and effort. We are well known for our proven quality, reliability and after-sales service.</p>
  <div class="note"><b>The narrative shift</b>From <i>"we can build it cheaper"</i> to <b>"when failure is not an option, choose Nandan."</b> Every conversation, every deck, every quote should carry that shift. If a proposal wins on price, we have sold the wrong thing.</div>
  <h3>Buying drivers — why they choose us</h3>
  <ul><li>Proven delivery record for quality-conscious companies with mission-critical equipment needs</li>
  <li>Compliance and certification readiness</li>
  <li>Customisation plus engineering strength</li>
  <li>Full lifecycle support</li>
  <li>Buying experience built on relationship</li>
  <li>Indigenous alternative to imports</li>
  <li>Responsiveness that global OEMs cannot match</li></ul>
  <h3>What they need versus what they want</h3>
  <table><tr><th>Customer needs — the specification</th><th>Customer desires — what actually wins it</th></tr>
  <tr><td>Value for investment — not cheap, not very expensive</td><td>A partner who understands their strategic goals</td></tr>
  <tr><td>Timely delivery with zero slippage</td><td>Proactive updates on progress — before they have to ask</td></tr>
  <tr><td>After-sales support and AMC availability</td><td>Lifetime cost of operation should be low</td></tr>
  <tr><td>Custom engineering and quick iterations</td><td>Enhances their productivity · reduces manpower</td></tr>
  <tr><td>Certifications — CE, ISO 3834, EN 1090, DGCA, AS9100D</td><td>A reputation-enhancing supplier relationship</td></tr>
  <tr><td>Lifecycle cost optimisation</td><td>Ease of documentation and compliance handling</td></tr>
  <tr><td>Audit-ready documentation and traceability</td><td>Quick technical support and spares availability</td></tr>
  <tr><td>A single accountable owner for the whole project, not five departments</td><td><b>To never have to chase Nandan for anything</b></td></tr>
  <tr><td>—</td><td><b>The truth told early when something slips — and a recovery date that then holds</b></td></tr></table>
  <div class="note"><b>Read the right-hand column again</b>Nothing there is about the machine. Every desire is about how it feels to buy from us. That is where the deal is actually won, and it is the column our competitors cannot copy.</div>
  <h3>Core capabilities that hold the UVP up</h3>
  <p><span class="chip go">Integrated design and fabrication shop with ISO / EN compliance</span><span class="chip">Software-based execution tracking — NandanERP + Genie</span><span class="chip">In-house testing infrastructure</span><span class="chip go">Heavy-duty hydraulic system engineering — the hardest thing to copy</span><span class="chip">Defence-grade documentation and QMS</span><span class="chip">Export compliance</span><span class="chip">Electrification and IoT integration</span></p>`},

 {id:"p-products",kicker:"Products and services",h2:"What we sell",
  html:`<p class="lead">The Breakthrough 2027 product line. Two entries are new strategic bets, and one is the recurring revenue layer we have never systematically sold.</p>
  <div class="grid">
   <div class="card"><span class="n">Flagship export platform</span><h4>Catering hi-lifts</h4><p>Built for the world rather than for one buyer. This is the platform the Export Engine runs on.</p></div>
   <div class="card"><span class="n">Aviation</span><h4>Ambulifts</h4><p>Passenger and paramedic handling at the aircraft.</p></div>
   <div class="card"><span class="n">Launching Sept 2026</span><h4>Electric hi-lift</h4><p>The electrification pilot. First proof of the Technology Edge driver on the product roadmap.</p></div>
   <div class="card"><span class="n">Defence</span><h4>Defence scissor lifts</h4><p>Ministry, PSU and prime applications.</p></div>
   <div class="card"><span class="n">Defence</span><h4>Defence ASRS and handling systems</h4><p>Automated storage and retrieval for strategic material.</p></div>
   <div class="card"><span class="n">Defence</span><h4>Workshop vehicles and special bodies</h4><p>Vehicle-mounted systems on customer-supplied chassis.</p></div>
   <div class="card"><span class="n">Industrial</span><h4>Truck loading platforms</h4><p>Loading and unloading without dock infrastructure.</p></div>
   <div class="card"><span class="n">Industrial</span><h4>Goods lifts</h4><p>Vertical travel of goods, including flameproof variants.</p></div>
   <div class="card"><span class="n">Industrial</span><h4>Heavy-duty turnkey lifting platforms</h4><p>Engineered for industrial use where standard equipment will not do.</p></div>
   <div class="card"><span class="n">Speciality</span><h4>Entertainment systems</h4><p>Stage and venue lifting applications.</p></div>
   <div class="card"><span class="n">Growth engine</span><h4>Contract manufacturing for foreign OEMs</h4><p>Their design, their market, our factory. Now named in the OPSP product list, not just in strategy.</p></div>
   <div class="card"><span class="n">Recurring revenue</span><h4>AMC, spares and lifecycle service</h4><p>The recurring revenue layer. Built into the initial sale, not sold afterwards.</p></div>
   <div class="card"><span class="n">Recurring revenue</span><h4>Refurbishment and upgrade programmes</h4><p>Rebuilding our own installed base before a competitor pitches a replacement.</p></div>
  </div>
  <h3>Credentials</h3>
  <p><span class="chip go">AS9100D</span><span class="chip">ISO 9001</span><span class="chip">ISO 14001</span><span class="chip">ISO 45001</span><span class="chip">ZED Gold</span><span class="chip go">EN 1090 EXC3</span><span class="chip go">ISO 3834</span><span class="chip">AWS D1.1</span><span class="chip">SAMAR</span><span class="chip">NDT — LP, MPI</span><span class="chip">GeM · SIDM · NSIC</span><span class="chip tbc">DGCA — a three-year target, not yet held</span></p>
  <p>Design on licensed SolidWorks; FE analysis in Ansys. Facility audited by Airbus and HAL.</p>
  <div class="note"><b>Two OPSP objectives land on this page</b><b>Standardise 45% of the product portfolio</b> and <b>platformisation so repeatability protects the margin instead of heroics</b>. Both require the product master — model, capacity, configuration, base cost, margin band, lead time, certifications. It still does not exist and still has no owner, and it now blocks a named Mission 2026-27 objective, not just the quotation generator. <span class="chip tbc">Assign an owner</span></div>`},

 {id:"p-industries",kicker:"Our industries",h2:"Where we sell — and where we do not",
  html:`<p class="lead">The playbook is clearest where most playbooks are vaguest: it names what to walk away from. That discipline is worth more than the target list.</p>
  <h3>Segments we serve</h3>
  <div class="grid">
   <div class="card"><span class="n">01</span><h4>Aviation GSE</h4><p>Airlines, airports, ground handlers, flight kitchens. Hi-lifts, ambulifts, baggage conveyors, step ladders, tugs, water and toilet service.</p></div>
   <div class="card"><span class="n">02</span><h4>Defence &amp; aerospace</h4><p>Air Force stations, defence PSUs, DRDO labs, BARC, ISRO, L&amp;T HED. Bomb loaders, VMSL, ASRS, scissor platforms, electric vehicles. Owned by Col. Acharya.</p></div>
   <div class="card"><span class="n">03</span><h4>Speciality handling</h4><p>Engineering, steel, pharma, chemical, paper, ports, warehousing, e-commerce, cold chain, data centres.</p></div>
   <div class="card"><span class="n">04</span><h4>Truck loading</h4><p>Logistics, transporters, distribution centres, FMCG, retail chains.</p></div>
   <div class="card"><span class="n">05</span><h4>Car parking</h4><p>Turntables, car lifts, rotary carousels. Builders, architects, hotels, malls, housing societies.</p></div>
   <div class="card"><span class="n">06</span><h4>Contract manufacturing <span class="chip hot" style="margin-left:4px">New</span></h4><p>European OEMs building under their own design and IP. Not in the 2025-26 playbook at all — the largest gap between the document and the strategy.</p></div>
  </div>
  <h3>Where we do not play</h3>
  <p>The playbook explicitly regrets: stack and puzzle parking, tower parking, wire rope lifts, passenger lifts, reefer trucks, aerial access boom lifts, stackers, pallet trucks, cranes, body building, workshop vans, manual scissor lifts, die loaders, dock levellers, and fuel bowsers above 950 litres. IndiaMART and trader enquiries in these categories are regretted at first contact.</p>
  <p>Geographic caution: general Middle East enquiries unless they call in or make second contact; Gujarat, North and South India regretted unless from a corporate or dealer.</p>
  <div class="note"><b>Review this list</b>It was written for 2020-21 and has not been revisited. Two entries now look wrong against current strategy: fuel bowsers above 950 litres are regretted, yet the live KDAIL programme is a 5,000 L bowser at Rs. 187.50 Cr; and blanket regional regrets sit oddly with a national defence and export ambition. <span class="chip tbc">Refresh needed</span></div>
  <h3>Who we avoid — the BANTTC test</h3>
  <div class="acr">
   <div><b>B</b>Budget</div><div><b>A</b>Authority</div><div><b>N</b>Need</div><div><b>T</b>Time</div><div><b>T</b>Technical</div><div><b>C</b>Competition</div>
  </div>
  <p>Plus the counterparty test added since: no MCA registration or corporate trace and a free email domain means Watchlist, and no facility access without an executed NDA. Anyone offering influence or access rather than a requirement — particularly on defence procurement — is refused and reported. Under DAP-2020 agent provisions and pre-contract integrity pacts this is business-ending, not grey.</p>`},

 {id:"p-customers",kicker:"Our customers",h2:"Who buys from us",
  html:`<p class="lead">Two reference sets, used for different jobs. Never attach volumes, values or commercial terms to any of them without written clearance.</p>
  <h3>European and aviation references</h3>
  <table><tr><th>Reference</th><th>What it proves</th><th>Use it with</th></tr>
  <tr><td>Airbus Defence and Space</td><td>Aerospace build discipline accepted by a tier-one European prime. Facility audited.</td><td>European OEMs, defence primes, aerospace tier-1s</td></tr>
  <tr><td>HAL</td><td>Facility audited by an Indian aerospace prime</td><td>Defence PSUs, Indian aerospace</td></tr>
  <tr><td>Safran / Cenco</td><td>Aerospace supply chain credibility</td><td>Aerospace and engine ecosystem</td></tr>
  <tr><td>LSG Sky Chefs — Zurich, Frankfurt</td><td>Equipment performing in demanding European hub operations</td><td>Flight kitchens, ground handlers, catering groups</td></tr>
  <tr><td>Paris-HQ African flight kitchen group</td><td>Multi-country catering deployment</td><td>Catering groups, Africa, francophone markets</td></tr>
  <tr><td>Gatwick Airport</td><td>Equipment in a major European hub</td><td>Airports, ground handlers, UK market</td></tr></table>
  <h3>Flagship case study</h3>
  <p>The Rapid Runway Repair vehicle is the case study the playbook leads with. Case studies are published at nandan.co.in/case-studies.</p>
  <div class="metric">
   <div><div class="v">35+</div><div class="l">Years</div></div>
   <div><div class="v">350+</div><div class="l">Team</div></div>
   <div><div class="v">1,20,000</div><div class="l">Sq ft · Khalapur</div></div>
   <div><div class="v">35+</div><div class="l">Countries</div></div>
   <div><div class="v">10,000+</div><div class="l">Units</div></div>
  </div>
  <h3>When and how to use a success story</h3>
  <p>Use it at the consultative interview, not before — a story lands only once you know the problem it should match. Name the customer, name what we did, and stop. When price becomes the objection, offer a reference call: it closes faster than any specification sheet.</p>
  <div class="note"><b>The asset we do not have</b>Over 10,000 units delivered into 35+ countries, and no register of who has what. Customer, equipment, year, location, last contact. Without it there is no aftermarket programme, no AMC campaign, no cross-sell, and stage 12 of our own process cannot be executed. <span class="chip tbc">Not built · owner not assigned</span></div>`},

  <div class="note"><b>The named weakness, restated</b>The playbook's own weakness list opens with "everything pointed towards the owners for decision making", and the 3–5 year priority is Dr. Raghu at zero involvement in transactions. Yet Dr. Raghu is still listed as the owner of three of six segments and the approver of every discount. Delegated price bands are the specific mechanism that closes this gap. Until they exist, the priority cannot be achieved.</div>
  <h3>Enquiry to sales order — the handoff</h3>
