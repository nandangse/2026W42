]},

/* ============ OUR SALES KIT ============ */
{id:"process",tab:"Sales Process",secs:[
 {id:"pr-a",kicker:"Part A",h2:"Always-on disciplines",
  html:`<p class="lead">Three disciplines that run every day regardless of what is in the pipeline. An opportunity does not pass <i>through</i> these — they are the conditions that make the nine stages work. Audited weekly, never "completed".</p>
  <div class="grid">
   <div class="card"><span class="n">A1</span><h4>Activity</h4><p><b>Daily:</b> recite the manifesto · hotlists · opportunities · inbound calls · email customers · LinkedIn post and 10 connects · shopfloor · customer visit. Every interaction into ERP. Daily report 8 pm, screenshot to the group.<br><br><b>Weekly:</b> collections · prospect bucket · tasklist · sales plan · visits · recording · review with coach or CEO · dashboard · <b>lost quote analysis, including who won and why</b>.</p></div>
   <div class="card"><span class="n">A2</span><h4>Resources</h4><p><b>Open:</b> nandan.co.in — /movie, /ppt-[sector], /case-studies · nandangse.com/[product] · nandan.ch · YouTube · LinkedIn.<br><br><b>Internal:</b> salesregrow.nandan.co.in · NandanERP and New Deal · Playbook · Drive — EVA briefs, InstaFinancials · Mygyaan.ai · dealers.nandan.co.in · Sheets · screenrec.com.<br><br><b>Raghu is your resource.</b></p></div>
   <div class="card"><span class="n">A3</span><h4>Way of working</h4><p>All emails read · open opportunities and draft quotes under control numbers · target quote status current · sales and visit plan updated · weekly intention Monday 9 am · recordings, screenshots and interactions filed.</p></div>
  </div>
  <h3>The weekly standard — per person</h3>
  <table><tr><th>Prospect calls</th><th>Prospect emails</th><th>Follow-up calls</th><th>Screen recordings</th><th>Customer visits</th><th>Zoom calls</th><th>Prospect bucket</th><th>Prospect · learn · strategy</th></tr>
  <tr><td><b>40</b></td><td><b>50</b></td><td><b>25</b></td><td><b>5</b></td><td><b>4</b></td><td><b>5</b></td><td><b>50+</b> in ERP</td><td><b>2 · 2 · 1</b> hrs</td></tr></table>
  <h3>Meeting cadence</h3>
  <table><tr><th>Meeting</th><th>When</th><th>Chair</th><th>Reviews</th></tr>
  <tr><td>Daily huddle</td><td>Morning · 15–30 min</td><td>Segment lead</td><td>Activities, blockers, plan for the day</td></tr>
  <tr><td>Weekly sales meeting</td><td>Monday · 60 min</td><td>Nitu</td><td><b>Lead metrics only</b> — activity, pipeline health, stage movements</td></tr>
  <tr><td>Monthly business review</td><td>Monthly · 2–3 hrs</td><td>Dr. Raghu</td><td><b>Results</b> — intake, profit, conversion, wins and losses, EVA board</td></tr>
  <tr><td>Quarterly business review</td><td>Half to full day</td><td>Chairman + Dr. Raghu</td><td><b>The OPSP</b> — targets, priorities, price bands, capability gaps</td></tr></table>
  <h3>The four standing rules</h3>
  <ul><li>If it is not in ERP, it did not happen</li>
  <li>One named owner and one dated next action, on every opportunity</li>
  <li>Every customer-facing number traces back to an approved source</li>
  <li>Keep documentation · know the margin on every case</li></ul>
  <div class="note"><b>Missing resources</b>Three things A2 should list and cannot: the <b>product master</b>, the <b>installed-base register</b>, and <b>competitor battlecards</b>. None exist and none have an owner. <span class="chip tbc">Assign</span></div>`},

 {id:"pr-b",kicker:"Part B",h2:"The nine stages",
  html:`<p class="lead">Nine stages, four gates. Orange markers are gates: a named person signs off, or the opportunity does not move.</p>
  <div class="rail">
   <div class="stage" data-n="B1"><h4>Lead generation</h4><div class="meta">Owner: segment lead</div><p><b>Inbound —</b> website · IndiaMART · TradeIndia · inbound call · existing client · referral · campaign · LinkedIn · Facebook · service · exhibition visitor · follow on live quotes.<br><b>Outbound —</b> Apollo.io campaign · cold call · self network · referrals · LinkedIn · tenders on GeM, NSIC and portals · networking · expo · visits · <b>EVA brief</b> for targeted account research.</p><div class="crit"><b>Intake routing:</b> inbound into ERP Opportunities by coordination or automation; outbound by the segment owner. Vet — anything not regretted goes to coordination, which researches industry, customer and contact. Intro mail, then a call four hours later with a prepared script, then a WhatsApp message.</div></div>

   <div class="stage gate" data-n="B2"><h4>Customer contact — Gate 1 · Qualify</h4><div class="meta">Decide whether this is worth Nandan's time — and prove it</div><p><b>Classify:</b> to regret — decline politely, record the reason, close, do not carry it · simple to validate · complex to validate, engineering input first · high priority, senior involvement.<br><b>Qualify:</b> one named owner · checklist complete · identify the <b>MAN</b> · probe <b>BANTTC</b> — budget, authority, need, time, technical, competition · counterparty verification, <b>MCA checked and InstaFinancials taken</b> · select the method for this deal — SPIN, MEDDIC, Gap, Challenger, TAS or Value.<br><b>Research and first call:</b> industry, customer and contact profiling · probe script · unique value messaging · name drops · content to mail · document in interactions · schedule the visit or Zoom.</p><div class="crit"><b>Hard stops — refuse and report:</b> no MCA trace plus a free email domain → Watchlist, and no facility access without an executed NDA. Anyone offering influence or access rather than a requirement. Any request for agency, commission or a success fee on defence procurement — under DAP-2020 agent provisions and pre-contract integrity pacts this is business-ending, not grey.</div></div>

   <div class="stage" data-n="B3"><h4>Consultative interview</h4><div class="meta">Understand the problem so well that the solution is obvious to them</div><p><b>Prepare:</b> appointment taken · calendar request with agenda, cc sales@nandan.co.in · study ERP history for person, company and industry · website, LinkedIn, YouTube · seniors' feedback · pre-call kit — brochures, testimonials, laptop with custom-headlined deck, cards, capture sheets · deck sent one hour before · WhatsApp of relevance · reconfirm in the morning · multiple meetings planned nearby.<br><b>The engage ladder:</b> <b>Opening →</b> attention — agenda, permission for time and questions, all key people present, phones silent. <b>Probing →</b> interest — SPIN and STAR questions, present mode, difficulties, critical concerns, the competition's weak areas; write it down. <b>Supporting →</b> conviction — implication and need-payoff, proof, name drops, benefits tied to <i>their</i> stated problems. <b>Motivating →</b> desire — dramatise, show the implication of not solving, under-promise, and <b>no ballpark figures</b>.</p><div class="crit"><b>Before you leave:</b> grade the prospect high, medium or low · probe future potential, repeat business, other locations, upsell and cross-sell · ask for references · identify the coach inside the account · fix the date and time of the next action.<br><b>After:</b> minutes of discussion by email and thanks on WhatsApp · the GAIN of acting and the PAIN of not acting · case studies · situation document capturing current state · <b>interaction posted in ERP within 4 hours</b>.</div></div>

   <div class="stage gate" data-n="B4"><h4>Quotation — Gate 2 · Offer</h4><div class="meta">A priced, scoped, defensible offer nobody has to explain afterwards</div><p><b>Build it:</b> issued from ERP with a control number · one-time costs quoted separately — design development, type testing, tooling — never absorbed into unit price · buyer-supplied items named and excluded · ex-works unless otherwise agreed in writing · validity date stated · price-variation clause on steel and bought-out content · justify VALUE, not just price.<br><b>Send it properly:</b> screenrec video on email and WhatsApp · call after sending · courier for high value · classify immediately, never left "to be assigned".<br><b>Classify:</b> <b>Target</b> — closing this month or next · <b>Live</b> — beyond two months or long term · <b>Lost, dropped</b> → record the reason, return to nurture · <b>Lost to competition</b> → record the reason <b>and who won and why</b> → analyse → battlecard.</p><div class="crit"><b>Three checks before issuing:</b> BANTTC revalidated · credit position cleared with Suresh Lalzare · PPC slot confirmed by Pankaj Sutar — never improvise a date.<br><b>Escalation:</b> above Rs. 10 lakh → detailed proposal with three options, RJ told. Above Rs. 50 lakh → <b>RJ approval in writing</b>.</div></div>

   <div class="stage" data-n="B5"><h4>Follow up</h4><div class="meta">Stay in the frame without becoming noise</div><p><b>Methods:</b> call · WhatsApp · email · Zoom · visit · engage on their LinkedIn · send data by post.<br><b>Standard:</b> add value on every contact, never "just checking in" · interaction posted within 48 hours · next action fixed and in the calendar · maintain a mailing rhythm · every message carries a call to action · personalise.</p><div class="crit"><b>Escalation:</b> no response after 3 contacts → change channel. After 5 contacts → change person. Static 30 days → flag at the Monday review. Static 60 days → close with a reason code, or re-qualify.</div></div>

   <div class="stage gate" data-n="B6"><h4>Closing — Gate 3 · Commercial</h4><div class="meta">Convert without conceding what we cannot afford to concede</div><p><b>ERP complete first:</b> interactions · research · competition identified · influencer identified · MAN confirmed.<br><b>Trial close:</b> price · deliverables · date of delivery · exceptions of scope · GA drawings · payment terms · <b>make three options and show them on the negotiating playbook</b>.<br><b>Negotiate:</b> limits set and written down <i>before</i> the meeting — nothing conceded in the room · objections answered from the standard list · any concession outside band goes back for sign-off.</p><div class="crit"><b>Non-negotiable:</b> safety features and compliance to the certified standard · design and testing costs on a bespoke build · any term breaching DAP-2020 or a pre-contract integrity pact · a delivery date PPC has not confirmed — PPC emails a response time for standard products.<br><b>Walk away when:</b> the margin will not cover the risk and there is no repeat path · terms or liquidated damages could break cash flow · mandatory requirements need a waiver · the counterparty offers influence rather than a requirement.</div></div>

   <div class="stage gate" data-n="B7"><h4>Sales order — Gate 4 · Contract review</h4><div class="meta">Hand a clean, unambiguous order to operations</div><p><b>Proforma invoice:</b> technical compliance · GA drawing · commercial terms · payment terms · <b>soft commitments recorded</b> · delivery dates and milestones.<br><b>Create the order:</b> sales order booking updated in ERP · entire TDS and all details filled · all communication summarised · pre-kickoff mail to RJ and PPC.<br><b>Handover:</b> project page created and email sent · design handover to design TDS · <b>advance received or LC established</b>.</p><div class="crit"><b>Contract review — the PO must pass all three:</b> commercially correct · technically correct · dates still valid. Any "no" goes back to the customer before acceptance. <b>Do not book a defective order.</b></div></div>

   <div class="stage" data-n="B8"><h4>Delivery</h4><div class="meta">Operations delivers exactly what sales committed. Sales does not disappear at order.</div><p><b>Run the project:</b> weekly update through PPC · status, photos and deadline · weekly review of dates and progress · make the milestone plan · decide what the customer's focus is.<br><b>Before delivery:</b> confirm operations is delivering what was committed · payment proforma sent one week before · proving batch or first-article inspection where applicable.<br><b>After:</b> payment follow-up · thank-you mail with the document bundle · billing updated · after-action report · satisfaction survey.</p></div>

   <div class="stage" data-n="B9"><h4>KAM — key account management</h4><div class="meta">The second order should cost a fraction of the first</div><p><b>Close it properly:</b> formal handover to the customer · thank-you gift · closing documentation by email · formal customer feedback · <b>testimonial taken in a letter</b> · full payment received · references and more orders sought.<br><b>Grow the account:</b> AMC proposal · cross-sell · up-sell · spares — contact <i>before</i> the failure, not after · refurbishment of our own older units.<br><b>Stay in view:</b> remain in the customer's vision · WhatsApp broadcast · email rhythm · one order in an industry → mailer to everyone else in that industry.</p><div class="crit"><b>Feed the loop:</b> new requirement identified → back to B2 as a new opportunity. None identified → the account is not being managed. Escalate at the monthly review.</div></div>
  </div>
  <div class="note"><b>The gap that remains</b>Every stage now has steps, owners and gates. What it does not have is <b>exit criteria</b> — the evidenced test that says an opportunity may advance. Without them a gate is a label rather than a control, and Gate 2 in particular cannot function until segment price bands exist. <span class="chip tbc">Dr. Raghu to restore or replace</span></div>`},

 {id:"pr-lead",kicker:"OPSP alignment",h2:"Lead conversion excellence",
  html:`<p class="lead">The OPSP names the sales process in five words — Suspect, Prospect, Proposal, Closure, Handover. The nine stages are that same process with the gates made explicit. Here is the mapping, so both documents describe one thing.</p>
  <table><tr><th>OPSP stage</th><th>Our stages</th><th>What has to be true</th></tr>
  <tr><td><b>Suspect</b></td><td>B1 Lead generation</td><td>A real company, a plausible requirement, a named person — in ERP</td></tr>
  <tr><td><b>Prospect</b></td><td>B2 Customer contact · B3 Consultative interview</td><td>Gate 1 passed. BANTTC probed, MAN identified, requirement documented</td></tr>
  <tr><td><b>Proposal</b></td><td>B4 Quotation · B5 Follow up</td><td>Gate 2 passed. 40% margin held, honest date, classified Target or Live</td></tr>
  <tr><td><b>Closure</b></td><td>B6 Closing</td><td>Gate 3 passed. Nothing conceded in the room</td></tr>
  <tr><td><b>Handover</b></td><td>B7 Sales order · B8 Delivery · B9 KAM</td><td>Gate 4 passed. <b>No order enters the floor without handover</b></td></tr></table>
  <h3>The six rules the OPSP sets for this team</h3>
  <div class="rail">
   <div class="stage gate" data-n="1"><h4>Quote to the 40% margin minimum</h4><div class="meta">Margin Fortress · enforced at quote stage</div><p>Not reviewed after the fact. A quote below 40% gross margin is a decision, taken deliberately and approved — never an accident discovered at review.</p></div>
   <div class="stage gate" data-n="2"><h4>Quote the honest date</h4><div class="meta">Delivery Spine</div><p>Win on reliability, not on an impossible promise we pay for twice. The date comes from PPC. Trust is the raw material of the order book.</p></div>
   <div class="stage" data-n="3"><h4>Engineering sells engineering</h4><div class="meta">Technical walkthroughs</div><p>Conduct technical walkthroughs with client teams. <b>The plant walk closes what the proposal opens.</b> Bring the customer to Khalapur.</p></div>
   <div class="stage" data-n="4"><h4>Know the tender calendar before the tender</h4><div class="meta">AI-Enabled Sales · CSF 8</div><p>Early identification of budget cycles and gatekeeper roles, using AI and personal connection. By the time the tender is published, the requirement is already written.</p></div>
   <div class="stage" data-n="5"><h4>Weekly funnel review, with the team</h4><div class="meta">Sales leadership</div><p>Every opportunity carries one owner, one next action, one date. This is the Monday meeting.</p></div>
   <div class="stage" data-n="6"><h4>Handover into execution</h4><div class="meta">CSF 10 · checklist-based</div><p>No order enters the floor without it. Dispatch checklist, installation readiness, customer satisfaction — all tracked.</p></div>
  </div>
  <h3>Long-term client loyalty — stage B9, expanded</h3>
  <ul><li>Quarterly reviews with top clients — <b>insight calls, not sales calls</b></li>
  <li>Spares and AMC packages built into the initial sale</li>
  <li>A dedicated Key Account Manager for the top 10 clients</li>
  <li>Offer new product trials to existing customers</li>
  <li>Referral and testimonial requests with loyalty rewards</li>
  <li>Annual equipment health audits</li>
  <li>Weekly project updates for every live order — <b>good news and bad, before the customer asks</b></li>
  <li>Proactive commissioning call after dispatch</li>
  <li><b>Zero customer reminders — tracked as a negative KPI</b></li></ul>
  <div class="note"><b>The sharpest metric on this site</b>"Zero customer reminders" turns responsiveness into something countable. Every time a customer has to chase us, it is logged against us. That single measure carries CSF 3, and it costs nothing to start.</div>`},

 {id:"pr-loops",kicker:"The loops",h2:"Six routes go backwards",
  html:`<p class="lead">The process is not a straight line. These six returns matter as much as the forward flow, and five of the six are where learning is either captured or lost.</p>
  <table><tr><th>#</th><th>From</th><th>Back to</th><th>Trigger</th></tr>
  <tr><td>1</td><td>B2 Customer contact</td><td>Closed — regretted</td><td>Fails BANTTC, or hits a hard stop</td></tr>
  <tr><td>2</td><td>B4 Quotation — lost</td><td>B1 / nurture</td><td>Requirement dropped</td></tr>
  <tr><td>3</td><td>B4 Lost to competition</td><td>Battlecard</td><td>Winner and reason recorded, analysed</td></tr>
  <tr><td>4</td><td>B5 Follow up, static 60 days</td><td>Closed with a reason code</td><td>No movement</td></tr>
  <tr><td>5</td><td>B7 Contract review fails</td><td>Back to the customer</td><td>Commercial, technical or date defect</td></tr>
  <tr><td>6</td><td>B9 KAM</td><td>B2 as a new opportunity</td><td>New requirement identified</td></tr></table>
  <div class="note"><b>Loop 3 is the cheapest asset we are not collecting</b>Lost quote analysis is already a weekly activity, and the process already says to record who won and why. Capture that against a competitor name and the battlecards build themselves within a quarter, at no cost.</div>`},

 {id:"pr-gates",kicker:"Authority",h2:"Who signs what",
  html:`<p class="lead">A gate is passed by a person, not by optimism.</p>
  <table><tr><th>Gate</th><th>Decision</th><th>Cleared by</th></tr>
  <tr><td>1</td><td>Qualification — the opportunity enters the funnel</td><td>Segment lead <span class="chip tbc">Confirm</span></td></tr>
  <tr><td>2</td><td>Offer inside the approved price band</td><td>Opportunity owner</td></tr>
  <tr><td>2</td><td>Quote above Rs. 10 lakh</td><td>RJ — intimation</td></tr>
  <tr><td>2</td><td>Quote above Rs. 50 lakh</td><td>RJ — approval in writing</td></tr>
  <tr><td>2</td><td>Credit exposure, LC and BG structure</td><td>Suresh Lalzare</td></tr>
  <tr><td>2</td><td>Delivery commitment</td><td>Cdr Giri with Pankaj Sutar</td></tr>
  <tr><td>3</td><td>Discount beyond band, or softened payment terms</td><td>Dr. Raghu</td></tr>
  <tr><td>4</td><td>Contract review — all three counts</td><td>Opportunity owner</td></tr>
  <tr><td>—</td><td>Equity, M&amp;A or JV structure</td><td>Dr. Raghu</td></tr></table>
  <h3>Standard payment terms</h3>
  <table><tr><th>Advance</th><th>On GAD approval</th><th>On delivery, incl. full GST</th><th>On commissioning</th></tr>
  <tr><td><b>20%</b></td><td><b>30%</b></td><td><b>40%</b></td><td><b>10%</b></td></tr></table>
  <div class="note"><b>One conflict to settle</b>This 20 / 30 / 40 / 10 split is the new standard. The live KDAIL programme runs 20 / 60 / 20 with no commissioning retention. Confirm whether KDAIL is a deliberate exception or needs realigning — the quotation generator currently defaults to the new standard.</div>
  <h3>Still open</h3>
  <ol><li><b>Exit criteria</b> for each gate — restore, or accept that gates run on judgement</li>
  <li><b>Price bands and delegated discount limits</b> per business line — without these, Gate 2 has no band to be inside and every discount reaches Dr. Raghu</li>
  <li><b>Gate 1 sign-off</b> — Santosh Patra previously held it; Nitu now chairs the Monday meeting</li>
  <li><b>Interaction posting</b> — 4 hours at B3, 48 hours at B5. One rule, please</li>
  <li><b>Owners</b> for the product master, installed-base register and battlecards</li></ol>`}
]},

{id:"kit",tab:"Our sales kit",secs:[
 {id:"k-ladder",kicker:"How we sell",h2:"The engage ladder",
  html:`<p class="lead">Nandan's own selling technique, from the playbook. Six moves, each with an objective. Learn the ladder, not a script — a script fails the moment the customer says something unexpected.</p>
  <div class="rail">
   <div class="stage" data-n="1"><h4>Opening</h4><div class="meta">Objective: attention</div><p>Preliminary pleasantries that establish you as a sales consultant, not a vendor. Smile, introduction, eye contact, greeting, compliment, handshake. Agenda stated. Permission for time. Permission to ask questions. Cards exchanged. All key people present. Phones on silent.</p></div>
   <div class="stage" data-n="2"><h4>Probing</h4><div class="meta">Objective: interest — find the hot button</div><p>Situation and problem questions. Probe for MAN. Identify present mode, difficulties in it, critical concern areas, problems caused by lack of a solution. Note the competition's weak areas. Write down their problems, inputs and expectations — do not carry them in your head.</p></div>
   <div class="stage" data-n="3"><h4>Supporting</h4><div class="meta">Objective: conviction</div><p>Implication and need-payoff explained. Company presentation. Photos, videos, testimonials. Name-dropping and success stories. Features, advantages and benefits tied to the problems <i>they</i> described — not a generic list.</p></div>
   <div class="stage" data-n="4"><h4>Motivating</h4><div class="meta">Objective: desire — convert need into want</div><p>Dramatise. Show the implication of not solving the problem. Assure them their problem will be solved. Be honest and under-promise on results. And avoid giving a ballpark figure — a number given here is a number you negotiate down from later.</p></div>
   <div class="stage" data-n="5"><h4>Closing</h4><div class="meta">Objective: action — ask for the order</div><p>Grade the prospect high, medium or low. Probe for future potential, repeat business, other locations, upsell and cross-sell. Ask for references. Handle prepared objections. Ask closed questions to fix the next step. End positively, and fix the date and time before leaving.</p></div>
   <div class="stage gate" data-n="6"><h4>Negotiating and final closing</h4><div class="meta">Objective: contract and payment</div><p>Terms, payment, exceptions, GA drawings. Limits set <i>before</i> the meeting, written down, not decided in the room.</p></div>
   <div class="stage" data-n="7"><h4>Keeping</h4><div class="meta">Objective: maximise the relationship</div><p>Repeat sales, upselling, cross-selling, references. Stage 12 of the process.</p></div>
  </div>
  <h3>The MAN checklist — take this to every meeting</h3>
  <p>Organisation name and address · telephone, website · organisational chart · man in charge · decision influencers · levels of personnel · organisational goals and values · history · decision-making procedure and route · evaluation criteria · budget · expansion plans · employee strength.</p>
  <h3>Pre-call checklist</h3>
  <p>Elevator pitch prepared · past interactions and quotations on ERP studied · company website, LinkedIn, YouTube reviewed · seniors' feedback taken · brochures, testimonials, marketing tools carried · laptop with custom-headlined presentation · visiting cards · pen, paper, diary, data-capture and checklist sheets · multiple meetings planned in the same organisation · other prospects nearby scheduled · well groomed.</p>`},

 {id:"k-method",kicker:"Method map",h2:"Which methodology, for which sale",
  html:`<p class="lead">Nandan's process is the container; the methodology is what you do inside it. Different sales need different methods, and using one method everywhere is why some conversations feel effortless and others stall.</p>
  <table><tr><th>Situation</th><th>Method</th><th>Why it fits, and where to use it</th></tr>
  <tr><td>Consultative interview, most deals</td><td><b>SPIN</b></td><td>Situation, problem, implication, need-payoff. Already embedded in stage 6 and in the engage ladder. This is the house method.</td></tr>
  <tr><td>Large, complex, multi-stakeholder — defence, PSU, KDAIL-scale programmes</td><td><b>MEDDIC</b></td><td>Metrics, economic buyer, decision criteria, decision process, identify pain, champion. Structured qualification for long B2B cycles. Use it where BANTTC is too coarse.</td></tr>
  <tr><td>Customer knows something is wrong but not what</td><td><b>Gap Selling</b></td><td>Map current state versus desired future state, then sell the bridge. Strongest with airlines and handlers: ask what fails most often, then quantify the gap.</td></tr>
  <tr><td>Well-informed buyer who thinks they know the answer</td><td><b>Challenger</b></td><td>Teach, tailor, take control. Use with European OEMs who have already decided outsourcing to India is risky — reframe rather than reassure.</td></tr>
  <tr><td>Named high-value accounts we want to break into</td><td><b>Target Account Selling</b></td><td>Select on criteria, research deeply, personalise, involve multiple functions. This is what the EVA brief programme already is — TAS with a research spine.</td></tr>
  <tr><td>Existing customers, stage 12 KAM</td><td><b>Value Selling</b></td><td>Quantify benefit in their numbers — cost per operating year, downtime avoided. Essential when the objection is price.</td></tr>
  <tr><td>Busy buyer, short attention, cold outreach</td><td><b>SNAP</b></td><td>Simple, invaluable, aligned, priority. Keep it short and lead with what matters to them.</td></tr>
  <tr><td>Inbound enquiries — IndiaMART, TradeIndia, website</td><td><b>Inbound Selling</b></td><td>Identify, connect, explore, advise. Do not pitch on an inbound; explore first, because inbound volume hides both the best and worst leads.</td></tr>
  </table>
  <div class="note"><b>How to use this table</b>Not as a menu to pick from mid-call. Decide the method at Gate 1 when the opportunity is classified, record it on the opportunity, and prepare accordingly. A complex defence programme run on a simple product script is the most common avoidable loss.</div>`},

 {id:"k-obj",kicker:"Section 10.1 — now filled",h2:"Objection handling",
  html:`<p class="lead">Section 10.1 of the playbook is a two-column table with no rows. Losing the same objection repeatedly because nobody wrote down the answer is the most expensive kind of silence. This is a first draft for the team to argue with and finish.</p>
  <table><tr><th>What they say</th><th>What we say</th></tr>
  <tr><td>"You are more expensive than the alternative."</td><td>Do not discount to match. Reframe on cost per operating year and the cost of an hour of downtime in their operation. Then offer one trial unit rather than defending a fleet price.</td></tr>
  <tr><td>"Your delivery is too long."</td><td>Never improvise a date. Give the slot PPC confirmed, and offer a phased delivery with a proving unit first — that usually solves their real problem, which is risk, not weeks.</td></tr>
  <tr><td>"How fast can you get me spares?"</td><td>Put a stocking commitment and a named service contact in the offer document, in writing. A verbal assurance is worth nothing against a competitor's written one.</td></tr>
  <tr><td>"Indian quality won't meet our standard."</td><td>AS9100D, EN 1090-1 EXC3, ISO 3834-2, AWS D1.1 welders, NDT in-house. Facility audited by Airbus and HAL. Equipment running at Zurich, Frankfurt and Gatwick. Then invite the audit — the invitation does more than the list.</td></tr>
  <tr><td>"We already have a supplier."</td><td>Good — the requirement is real and budgeted. Ask what their supplier cannot do. Target that single gap with one unit.</td></tr>
  <tr><td>"Send me your best price and I'll compare."</td><td>Decline politely. Price without the requirement defined is a number you will be held to. Return to probing: what does it have to do, in what cycle, in what environment.</td></tr>
  <tr><td>"We need it customised."</td><td>Ask what the customisation is protecting — a process, a constraint, or a preference. Preferences we can often standardise around; constraints we engineer for and price separately.</td></tr>
  <tr><td>"Send it and we'll get back to you."</td><td>Agree, and fix the date of the call before you leave. An opportunity without a dated next action is not an opportunity.</td></tr>
  <tr><td>"Can you give agency terms / a commission?" <span class="chip hot">Defence</span></td><td>No, and the conversation ends there. Under DAP-2020 agent provisions and pre-contract integrity pacts this is business-ending. Refuse, document, and report.</td></tr>
  </table>
  <h3>The objections we cannot answer yet</h3>
  <p>Every one of these needs the product master or a written discount policy before a seller can answer it consistently: what is the price of the standard model; what is the standard lead time; what discount can I actually give; what is included and what is extra. Until those exist, every seller answers differently and the customer notices.</p>`},

 {id:"k-nego",kicker:"Section 12 — proposed",h2:"Negotiation and discount policy",
  html:`<p class="lead">Section 12 of the playbook asks six questions about negotiation and answers none of them. Below is a proposed policy — drafted, not adopted. It needs Dr. Raghu's approval before it means anything.</p>
  <h3>12.1 — Policy on negotiation and discounts <span class="chip tbc">Proposed</span></h3>
  <ul><li>No ballpark figures. Ever. The first number the customer hears is the formal quote.</li>
  <li>One-time costs — design development, type testing, tooling — are always quoted as separate, visible lines. They are never absorbed into unit price.</li>
  <li>Quotes are ex-works unless otherwise agreed in writing. Freight, insurance and duty scoped explicitly.</li>
  <li>Buyer-supplied items are named in the offer and excluded from scope.</li>
  <li>Every offer carries a validity date and a price-variation clause on steel and bought-out content.</li>
  <li>Credit position cleared with Accounts <i>before</i> the offer goes out.</li>
  <li>Limits are set and written down before the meeting. Nothing is conceded in the room.</li></ul>
  <h3>12.2 — Approval route <span class="chip tbc">Proposed</span></h3>
  <table><tr><th>Decision</th><th>Cleared by</th></tr>
  <tr><td>Offer inside the approved price band</td><td>Opportunity owner</td></tr>
  <tr><td>Discount beyond band, or softened payment terms</td><td>Dr. Raghu</td></tr>
  <tr><td>Delivery commitment</td><td>Cdr Giri with Pankaj Sutar</td></tr>
  <tr><td>Credit exposure, LC and BG structure</td><td>Suresh Lalzare</td></tr>
  <tr><td>Equity, M&amp;A or JV structure</td><td>Chairman J.C. Kumar and Dr. Raghu</td></tr></table>
  <h3>Reference payment structure</h3>
  <p><b>20%</b> advance with order · <b>30%</b> on GAD approval · <b>40%</b> on delivery plus full GST · <b>10%</b> on commissioning. Anything softer is a Dr. Raghu decision, not a seller's. See <b>Sales Process → Who signs what</b>.</p>
  <h3>12.5 — What is non-negotiable</h3>
  <ul><li>Safety features and compliance to the certified standard</li><li>Design and testing costs on a bespoke build</li><li>Any term that breaches DAP-2020 or a pre-contract integrity pact</li><li>Delivery dates PPC has not confirmed</li></ul>
  <h3>12.6 — When to walk away</h3>
  <ul><li>The margin will not cover the risk carried, and there is no repeat path to justify it</li><li>Payment terms or liquidated damages that could break cash flow — a named weakness we cannot afford to test</li><li>Mandatory requirements we cannot meet without a waiver</li><li>Any counterparty offering influence rather than a requirement</li></ul>
  <div class="note"><b>Why this is still a draft</b>A discount policy needs a floor, and a floor needs product costing. The playbook's own weakness list says product costing is not complete. Until it is, "the approved band" is a phrase, not a number — and every discount will keep routing to Dr. Raghu.</div>`},

 {id:"k-assets",kicker:"Tools",h2:"Scripts, templates and where things live",
  html:`<h3>Outreach assets in the playbook</h3>
  <table><tr><th>Channel</th><th>What exists</th><th>Section</th></tr>
  <tr><td>Phone</td><td>Two call scripts — project-today, and general introduction</td><td>7.3, 7.4</td></tr>
  <tr><td>Email</td><td>Two introduction templates — Vertilift, tyre handling</td><td>7.5, 7.6</td></tr>
  <tr><td>WhatsApp</td><td>Two introduction templates</td><td>7.7, 7.8</td></tr>
  <tr><td>LinkedIn</td><td>Two templates — community post, product post</td><td>7.9, 7.10</td></tr>
  <tr><td>Post-event / post-referral</td><td>WhatsApp and email templates</td><td>7.11, 7.12</td></tr>
  <tr><td>Follow-up</td><td>Email and WhatsApp templates</td><td>8.2, 8.3</td></tr>
  <tr><td>Post-presentation follow-up</td><td>Call, WhatsApp, email templates</td><td>11.2–11.4</td></tr>
  <tr><td>Referrals</td><td>Call, WhatsApp and email scripts</td><td>13.2, 13.3</td></tr>
  <tr><td>Discovery</td><td>Question bank and discovery questions</td><td>9.4, Question Bank</td></tr>
  </table>
  <div class="note"><b>Every template needs a factual pass</b>Templates written when we were "30 years and 150 people across 2 factories" are still going out. Before any further outreach, sweep every script and template for: years in business, team size, number of facilities, certification status. This is a half-day of work that stops a wrong number reaching a customer.</div>
  <h3>ERP — the single system of record</h3>
  <p>NandanERP holds client list, potentials list, open opportunities, draft quotes, target quotes, live quotes, lost quotes, open sales orders, interaction master and the daily reporting form. Every seller bookmarks all of them.</p>
  <p><b>The rule:</b> if it is not in ERP, it did not happen. Interactions posted within 48 hours. Prospect bucket at 50+. No quote left "to be assigned".</p>
  <h3>Brand discipline</h3>
  <p>Navy #1B2A5E, Orange #F04E23, white background. Logo top-left on white, never on a coloured or photographic field. Currency written as "Rs." throughout, never as a symbol.</p>
  <p><b>LinkedIn:</b> Tuesday to Thursday, IST mornings. Native video upload over YouTube links — YouTube link in the first comment. Early comment engagement drives reach. Maximum seven hashtags.</p>
  <h3>Training and guardianship</h3>
  <p>Section 17 sets the playbook's own maintenance: how the team trains and retrains on it, who guards it for the financial year, how feedback is gathered, and how often it evolves. Mohnish Nair coaches. The read log at the front of the playbook is how compliance is evidenced.</p>`}
]},

/* ============ OUR COMPETITORS ============ */
{id:"comp",tab:"Our competitors",secs:[
 {id:"c-land",kicker:"Landscape",h2:"Who we run into",
  html:`<p class="lead">Section 5.1 of the playbook asks who our competitors are. It is blank. Section 5.2 asks how we play to win, and answers with five words. That is the whole competitive intelligence Nandan holds in writing.</p>
  <h3>What 5.2 says we win on</h3>
  <p><span class="chip go">Bespoke solution provider</span><span class="chip go">Unique in market</span><span class="chip go">Safety features</span><span class="chip go">Quick service accessibility</span><span class="chip go">Documentation</span></p>
  <p>Those are real strengths, and they are consistent with the strengths list — responsiveness and out-of-the-box solutioning. But they are claims, not comparisons. A claim only becomes a competitive argument when it is set against a named alternative.</p>
  <h3>The groups we actually meet</h3>
  <table><tr><th>Group</th><th>Where they beat us</th><th>Where we beat them</th></tr>
  <tr><td>Global GSE majors — TLD, JBT AeroTech, Textron GSE, Charlatte, Vestergaard, Mallaghan, Aviogei</td><td>Brand, global service network, financing, installed base</td><td>Price position, willingness to build bespoke, responsiveness on non-standard requirements</td></tr>
  <tr><td>Chinese manufacturers — Weihai Guangtai and peers</td><td>Unit price, delivery speed on standard models</td><td>Certification depth, European references, build to Western standards, defence acceptability</td></tr>
  <tr><td>Indian competitors — Three D Integrated Solutions and regional fabricators</td><td>Local relationships, lower overhead on simple work</td><td>AS9100D, EN 1090-1 EXC3, export track record, Airbus and HAL audits</td></tr>
  <tr><td>Eastern European contract manufacturers</td><td>Proximity, no customs friction, shorter logistics</td><td>Cost position, skilled welding capacity at scale, aerospace certification</td></tr>
  <tr><td>IndiaMART traders and body builders</td><td>Speed and price on commodity work</td><td>We do not compete here — the playbook already regrets this category, correctly</td></tr>
  </table>
  <div class="note"><b>Signal worth acting on now</b>Three D Integrated Solutions is debarred by AAI. That creates a live gap in airport tenders and in accounts where they were incumbent. The EVA brief mapping it is still pending. This is a competitor situation that converts to revenue, not just intelligence.</div>
  <div class="note"><b>The cheapest intelligence we are not collecting</b>Every lost quote already tells us who won and why. The 2023 process has "Lost to Competition → Analyze and Learn" built in, and Lost Quote Analysis is a weekly activity on the checklist. If that analysis were captured against a competitor name, we would have battlecards within a quarter at no cost. <span class="chip tbc">Not being captured</span></div>`},

 {id:"c-battle",kicker:"Battlecard",h2:"The standard battlecard",
  html:`<p class="lead">One per named competitor. Short enough to read before a call, specific enough to change what you say in it.</p>
  <table><tr><th>Field</th><th>What goes in it</th></tr>
  <tr><td>Who they are</td><td>Origin, size, ownership, where they manufacture</td></tr>
  <tr><td>Products that overlap</td><td>Model for model against ours</td></tr>
  <tr><td>Price position</td><td>Above, at or below us — with a percentage where we have evidence from a lost quote</td></tr>
  <tr><td>Lead time</td><td>Theirs versus ours on comparable equipment</td></tr>
  <tr><td>Their pitch</td><td>The three things they say in the room</td></tr>
  <tr><td>Their weak point</td><td>Where customers complain — service response, spares cost, refusal to customise</td></tr>
  <tr><td>How we win</td><td>The specific reframe, not a general claim</td></tr>
  <tr><td>How we lose</td><td>Honestly. If we cannot beat them on a requirement, no-bid earlier.</td></tr>
  <tr><td>Accounts contested</td><td>Where we met them and what happened</td></tr>
  <tr><td>Last updated</td><td>Date and owner. A battlecard older than six months is misinformation.</td></tr></table>
  <h3>Where the input comes from</h3>
  <ul><li><b>Lost quote analysis</b> — already a weekly activity. Add one field: who won.</li>
  <li><b>Trade fairs</b> — Eurosatory, Farnborough, GSE Expo Europe. Walk competitor stands deliberately and file a note.</li>
  <li><b>Published tender awards</b> — show price and winner.</li>
  <li><b>Customers</b> — the most honest source. Ask what else they evaluated, and why they chose what they chose.</li></ul>
  <div class="note"><b>Discipline</b>Never disparage a competitor to a customer. State what we do, name our references, and let the comparison make itself. Buyers remember who ran down a rival, and it is rarely the one they buy from.</div>`}
]},

/* ============ QUOTATION GENERATOR ============ */
{id:"quote",tab:"Quotation generator",secs:[
 {id:"q-tool",kicker:"Working prototype",h2:"Build a quotation",
  html:`<p class="lead">A working v1 that applies our commercial rules automatically — one-time costs separated, Indian formatting, milestone amounts calculated, and approval flags raised where a rule is breached. The Rs. 10 lakh threshold from playbook section 7.1.2 is built in.</p>
  <div class="qg">
   <div class="qghd">Quotation builder</div>
   <div class="qgbody">
    <div class="qgin">
     <div class="qgsub">Customer</div>
     <div class="f2">
      <div class="fld"><label>Customer name</label><input id="q_cust" type="text" placeholder="Customer name"></div>
      <div class="fld"><label>Quote reference</label><input id="q_ref" type="text"></div>
     </div>
     <div class="f2">
      <div class="fld"><label>Business line</label><select id="q_line">
        <option>Aviation GSE</option><option>Defence &amp; aerospace</option><option>Speciality handling systems</option>
        <option>Truck loading solutions</option><option>Car parking solutions</option><option>Contract manufacturing</option></select></div>
      <div class="fld"><label>Validity (days)</label><input id="q_val" type="number" value="30"></div>
     </div>
     <div class="fld"><label>Equipment description</label><textarea id="q_desc" placeholder="e.g. 5,000 L SS-316L insulated water bowser — tank system design, fabrication and integration"></textarea></div>
     <div class="qgsub">Pricing</div>
     <div class="f3">
      <div class="fld"><label>Quantity</label><input id="q_qty" type="number" value="1" min="1"></div>
      <div class="fld"><label>Unit price (Rs.)</label><input id="q_unit" type="number" value="3750000"></div>
      <div class="fld"><label>Discount %</label><input id="q_disc" type="number" value="0" step="0.5"></div>
      <div class="fld"><label>Unit cost — bought-out + labour (Rs.)</label><input id="q_cost" type="number" value="0"></div>
     </div>
     <div class="f3">
      <div class="fld"><label>Design development (Rs.)</label><input id="q_dd" type="number" value="0"></div>
      <div class="fld"><label>Type testing (Rs.)</label><input id="q_tt" type="number" value="0"></div>
      <div class="fld"><label>Tooling (Rs.)</label><input id="q_tool" type="number" value="0"></div>
     </div>
     <div class="f3">
      <div class="fld"><label>Incoterm</label><select id="q_inco"><option>Ex-works</option><option>FOB</option><option>CIF</option></select></div>
      <div class="fld"><label>Freight &amp; insurance (Rs.)</label><input id="q_frt" type="number" value="0"></div>
      <div class="fld"><label>GST %</label><input id="q_gst" type="number" value="18" step="0.5"></div>
     </div>
     <div class="qgsub">Terms &amp; schedule</div>
     <div class="f3">
      <div class="fld"><label>Advance %</label><input id="q_p1" type="number" value="20"></div>
      <div class="fld"><label>GAD approval %</label><input id="q_p2" type="number" value="30"></div>
      <div class="fld"><label>On delivery %</label><input id="q_p3" type="number" value="40"></div>
      <div class="fld"><label>Commissioning %</label><input id="q_p4" type="number" value="10"></div>
     </div>
     <div class="f3">
      <div class="fld"><label>Proving batch (units)</label><input id="q_pb" type="number" value="5"></div>
      <div class="fld"><label>Proving batch at month</label><input id="q_pm" type="number" value="4"></div>
      <div class="fld"><label>Rate after ramp (units/mo)</label><input id="q_rate" type="number" value="25"></div>
     </div>
     <div class="fld"><label>Buyer-supplied items (excluded from scope)</label><input id="q_bsi" type="text" placeholder="e.g. Ashok Leyland Stallion 4x4 chassis"></div>
     <div class="f3">
      <div class="fld"><label>BANTTC revalidated</label><select id="q_bt"><option>Not yet</option><option>Yes</option></select></div>
      <div class="fld"><label>Credit cleared</label><select id="q_cred"><option>Not yet</option><option>Cleared</option></select></div>
      <div class="fld"><label>PPC slot confirmed</label><select id="q_ppc"><option>Not yet</option><option>Confirmed</option></select></div>
     </div>
    </div>
    <div class="qgout" id="q_out"></div>
   </div>
  </div>`},

 {id:"q-scope",kicker:"The big project",h2:"What the full generator needs",
  html:`<p class="lead">The prototype proves the logic. The system you actually want depends on data Nandan does not yet hold — and the playbook says so itself.</p>
  <h3>Prerequisite: the product master</h3>
  <p>For every sellable item: model number, business line, description, capacity or rating, standard configuration, common options, base cost, target margin band, standard lead time, applicable certifications. The playbook's weakness list already names this — "product costing is not complete" — and one of the quarterly transformational priorities is "standardisation of the products for sales, design and production". That priority and this document are the same task.</p>
  <div class="note"><b>Honest sequencing</b>The product master is worth more than the generator. Build it first even if the generator waits. A good salesperson with a product master beats a poor one with software.</div>
  <h3>Build phases</h3>
  <div class="rail">
   <div class="stage" data-n="1"><h4>Product master</h4><div class="meta">Owner: Santosh Patra with PPC, design and Accounts</div><p>One sheet, every sellable item, costs and lead times validated. Closes a named weakness and a stated quarterly priority at the same time.</p></div>
   <div class="stage" data-n="2"><h4>Rules engine</h4><div class="meta">Owner: Sales with Accounts</div><p>Price bands per line, delegated discount limits, GST logic, incoterm handling, freight tables, price-variation clause on steel, the Rs. 10 lakh detailed-proposal threshold, three-option logic.</p></div>
   <div class="stage gate" data-n="3"><h4>Approval workflow</h4><div class="meta">Sign-off: Dr. Raghu</div><p>Routes automatically by value and discount. Nothing leaves without BANTTC revalidated, credit cleared and PPC slot confirmed.</p></div>
   <div class="stage" data-n="4"><h4>Document output</h4><div class="meta">Owner: Sales with brand</div><p>Branded PDF in house style — navy and orange, logo top-left on white, Rs. throughout. Scope, exclusions, buyer-supplied items, validity and terms all printed. Three options where the threshold applies.</p></div>
   <div class="stage" data-n="5"><h4>ERP integration and register</h4><div class="meta">Owner: Santosh Patra</div><p>Every quote numbered, logged, versioned and linked to its opportunity, classified Target, Live or Lost. Feeds the offer-to-order rate directly. NandanERP already holds these reports — the generator should write into them, not beside them.</p></div>
   <div class="stage" data-n="6"><h4>Multi-currency and export</h4><div class="meta">Owner: Ankeet Trivedi</div><p>EUR, USD and CHF quoting, incoterm variants, export documentation checklist. Required before Europe scales.</p></div>
  </div>
  <h3>Decisions needed before phase 2</h3>
  <ul><li>Price bands and delegated discount limits per business line</li>
  <li>Standard margin targets — and whether contract manufacturing differs from product sales</li>
  <li>Whether export quotes are held in Rs. or customer currency, and who carries FX risk</li>
  <li>Quote numbering convention, and whether it extends the existing ERP series</li></ul>`}
]},

/* ============ METRICS ============ */
{id:"metrics",tab:"Metrics",secs:[
 {id:"m-results",kicker:"Results",h2:"Lagging metrics",
  html:`<p class="lead">These tell us what happened. They are the score, and by the time they move it is too late to change them.</p>
  <table><tr><th>Metric</th><th>Definition</th><th>Reviewed</th><th>Target</th></tr>
  <tr><td>Revenue</td><td>Billing revenue against the Mission 2026-27 number</td><td>Monthly</td><td><b>Rs. 100 Cr</b> by 31 Mar 2027</td></tr>
  <tr><td>Order intake</td><td>Value of orders bagged in the period, by line and segment</td><td>Monthly</td><td>Ahead of the revenue run rate</td></tr>
  <tr><td>PBT %</td><td>Profit before tax</td><td>Monthly</td><td><b>10%</b> by 31 Mar 2027</td></tr>
  <tr><td>EBITDA margin</td><td>OPSP objective</td><td>Monthly</td><td><b>≥18%</b> by Mar 2027</td></tr>
  <tr><td>Gross margin at quote</td><td>Margin Fortress — enforced at quote stage, not reviewed after</td><td>Every quote</td><td><b>40% minimum</b></td></tr>
  <tr><td>Export revenue</td><td>Export Engine — half the business</td><td>Monthly</td><td><b>Rs. 50 Cr</b> · 50% of revenue</td></tr>
  <tr><td>OTIF</td><td>On time in full. Delivery Spine — the trust metric.</td><td>Monthly</td><td><b>95%</b>, held four consecutive quarters</td></tr>
  <tr><td>Working capital cycle</td><td>Cash Discipline</td><td>Monthly</td><td><b>&lt;30 days</b> by Mar 2027</td></tr>
  <tr><td>Product portfolio standardised</td><td>Platformisation — protects margin without heroics</td><td>Quarterly</td><td><b>45%</b></td></tr>
  <tr><td>Pipeline value</td><td>Total value of active opportunities. Already defined as a CRM metric in section 15.2.</td><td>Weekly</td><td>Baseline first</td></tr>
  <tr><td>Quote conversion rate</td><td>Percentage of quotes that close. Defined in 15.2; not yet reported.</td><td>Monthly</td><td>Baseline first</td></tr>
  <tr><td>Gate conversion</td><td>Percentage clearing each of the four gates. Shows where we actually lose.</td><td>Monthly</td><td>Baseline first</td></tr>
  <tr><td>Loss reason distribution</td><td>Across the reason codes, with the winning competitor named</td><td>Monthly</td><td>—</td></tr>
  <tr><td>Cash: collections</td><td>Debtors collected. Rolling 13-week forecast.</td><td>Weekly</td><td>Working capital under 30 days</td></tr>
  <tr><td>Export order execution</td><td>Customer satisfaction on export orders</td><td>Quarterly</td><td><b>90%</b></td></tr>
  <tr><td>Customer retention</td><td>Repeat business across the base</td><td>Quarterly</td><td><b>1,000+ customers</b> with repeat business</td></tr>
  <tr><td>Aftermarket share</td><td>Spares, AMC, refurbishment and service as a percentage of revenue</td><td>Monthly</td><td><span class="chip tbc">Currently unmeasured</span></td></tr>
  </table>
  <h3>Loss reason codes</h3>
  <p><span class="chip">Price</span><span class="chip">Lead time</span><span class="chip">Technical capability</span><span class="chip">Certification gap</span><span class="chip">Payment terms</span><span class="chip">Incumbent</span><span class="chip">Customer deferred</span><span class="chip">We regretted</span><span class="chip">No decision</span><span class="chip hot">+ who won</span></p>
  <div class="note"><b>Baseline before target</b>Setting a target on a metric never measured produces a number nobody believes. Measure one quarter, then set the target from evidence. The exception is order intake and profit, where the numbers already exist and only need to be dated to a financial year.</div>`},

 {id:"m-lead",kicker:"Lead metrics",h2:"Leading indicators",
  html:`<p class="lead">These are the ones we can act on this week. Nandan already has them — the weekly salesman checklist is a lead-metric system, it just is not being read as one.</p>
  <h3>The activity standard, already set</h3>
  <table><tr><th>Activity</th><th>Per person, per week</th><th>Team, per month</th></tr>
  <tr><td>Prospecting calls</td><td>40</td><td>200</td></tr>
  <tr><td>Prospecting emails</td><td>20</td><td>100</td></tr>
  <tr><td>Follow-up calls</td><td>20</td><td>100</td></tr>
  <tr><td>Loom recordings</td><td>2</td><td>10</td></tr>
  <tr><td>Customer visits</td><td>2</td><td>10</td></tr>
  <tr><td>Zoom calls</td><td>1</td><td>5</td></tr>
  <tr><td>Prospect bucket in ERP</td><td>50+ maintained</td><td>—</td></tr></table>
  <h3>Weekly discipline checklist</h3>
  <p>Opportunity attended within 24 hours · two hours of prospecting blocked each week · hot target quotes called · live quotes called · smart task updated and followed · manifesto recited · excellence discussion on prospecting · two hours of learning · one hour of strategy work planned.</p>
  <h3>The pipeline-health metrics to add</h3>
  <table><tr><th>Metric</th><th>Why it predicts</th><th>Owner</th></tr>
  <tr><td>Opportunities with no dated next action</td><td>Should be zero. Anything above zero is decay in progress.</td><td>Santosh Patra</td></tr>
  <tr><td>Opportunities static over 30 days</td><td>Early warning of a stalling pipeline, well before results move</td><td>Santosh Patra</td></tr>
  <tr><td>Interactions posted within 48 hours</td><td>The single best proxy for whether the process is being followed at all</td><td>Santosh Patra</td></tr>
  <tr><td>Quotes still "to be assigned"</td><td>Should be zero. An unclassified quote is an unmanaged one.</td><td>Opportunity owners</td></tr>
  <tr><td>Gate 1 clearances</td><td>New qualified opportunities entering the funnel</td><td>Santosh Patra</td></tr>
  <tr><td>NDAs executed</td><td>The real gate for contract manufacturing. No NDA, no drawings, no order.</td><td>Ankeet Trivedi</td></tr>
  <tr><td>Installed-base contacts made</td><td>Aftermarket cannot grow without outbound contact to existing customers</td><td><span class="chip tbc">Unassigned</span></td></tr>
  <tr><td>Lost quote analyses completed with competitor named</td><td>Builds the battlecards at zero cost</td><td>Opportunity owners</td></tr>
  <tr><td><b>Customer reminders received</b></td><td>The OPSP negative KPI. Every time a customer chases us it is logged against us. Target: zero.</td><td>Opportunity owners</td></tr>
  <tr><td>Quotes below 40% gross margin</td><td>Margin Fortress leakage, caught at quote rather than at review</td><td>Santosh Patra</td></tr>
  <tr><td>Technical walkthroughs and plant visits held</td><td>The plant walk closes what the proposal opens</td><td>Opportunity owners</td></tr>
  <tr><td>Weekly project updates sent on live orders</td><td>Good news and bad, before the customer asks. Carries CSF 3 and CSF 10.</td><td>Opportunity owners</td></tr>
  </table>
  <div class="note"><b>The gap is not measurement, it is use</b>The activity targets have existed for years. What is missing is the loop: activity numbers reviewed weekly against gate conversion, so the team can see which activity actually produces orders. Forty calls a week is only a good target if we know what forty calls converts to.</div>`},

 {id:"m-cadence",kicker:"Rhythm",h2:"The review cadence",
  html:`<p class="lead">Four rhythms, all already defined in section 16 of the playbook. The change Sales Regrow makes is what each one looks at.</p>
  <div class="rail">
   <div class="stage" data-n="D"><h4>Daily huddle</h4><div class="meta">15–30 min · morning</div><p>Key activities, blockers, plan for the day. Daily report by 8 pm. No metrics review here — this is unblocking, not reporting.</p></div>
   <div class="stage" data-n="W"><h4>Weekly sales meeting</h4><div class="meta">60 min · Monday · Santosh Patra chairs</div><p><b>Lead metrics only.</b> Activity against standard. Opportunities with no next action. Static over 30 days. Quotes unclassified. What advanced a stage and on what evidence. Weekly intention posted by 9 am.</p></div>
   <div class="stage gate" data-n="M"><h4>Monthly business review</h4><div class="meta">2–3 hours · Dr. Raghu chairs</div><p><b>Results.</b> Order intake, profit, export share, quote conversion, gate conversion. Wins and losses with reason codes and who won. The EVA verdict board account by account. Capacity versus committed delivery with Cdr Giri and Pankaj Sutar.</p></div>
   <div class="stage gate" data-n="Q"><h4>Quarterly business review</h4><div class="meta">Half to full day · Chairman and Dr. Raghu</div><p><b>The OPSP itself.</b> Performance against targets, financial review, strategic initiatives, next quarter's priorities. Europe across all four prongs. Price bands and approval limits reset. Capability gaps — what we lost for reasons we could have fixed.</p></div>
  </div>
  <div class="note"><b>One change worth making</b>Split the weekly and the monthly by metric type. If the Monday meeting reviews revenue, the team spends Monday explaining the past. If it reviews activity and pipeline health, they spend Monday changing the future. The playbook already sets the cadence correctly — this is only about what gets put on the table.</div>`}
]},

/* ============ CURRENT ============ */
{id:"current",tab:"Current",secs:[
 {id:"cu-gaps",kicker:"Gap register",h2:"What the playbook is missing",
  html:`<p class="lead">The 2025-26 playbook runs to 267 pages and contains real, hard-won material. But several of its most commercially important sections are headings with nothing underneath. Those blanks are where deals are being lost.</p>
  <table><tr><th>Section</th><th>What it asks</th><th>State</th></tr>
  <tr><td>5.1</td><td>Who are our competitors?</td><td><span class="chip hot">Empty</span> Frame drafted in Our competitors</td></tr>
  <tr><td>6.1</td><td>What are the stages in our sales process and what do they mean?</td><td><span class="chip hot">Empty table</span> Filled in Our Sales Plan — needs sign-off</td></tr>
  <tr><td>7.1</td><td>Where do we find data on our prospects?</td><td><span class="chip hot">Empty table</span></td></tr>
  <tr><td>10.1</td><td>Objection handling</td><td><span class="chip hot">Empty table</span> Draft in Our sales kit</td></tr>
  <tr><td>10.2</td><td>Frequently asked questions</td><td><span class="chip hot">Empty table</span></td></tr>
  <tr><td>11.1–11.3</td><td>Post-presentation follow-up timing and scripts</td><td><span class="chip hot">Headings only</span></td></tr>
  <tr><td>12.1–12.6</td><td>Negotiation, discount policy, approvals, non-negotiables, walk-away</td><td><span class="chip hot">All empty</span> Draft in Our sales kit</td></tr>
  <tr><td>9.8</td><td>What to avoid, from failed conversations</td><td><span class="chip hot">Heading only</span></td></tr>
  <tr><td>—</td><td>Contract manufacturing / Europe</td><td><span class="chip hot">Absent entirely</span></td></tr>
  </table>
  <h3>Factual corrections needed</h3>
  <table><tr><th>Where</th><th>Says</th><th>Should say</th></tr>
  <tr><td>UVM page 93, UVP page 135</td><td>30 years · 150 members · 2 factories · "on the way to AS9100D"</td><td>35+ years · 350+ team · 1,20,000 sq ft Khalapur · AS9100D certified</td></tr>
  <tr><td>Section 2.5</td><td>Almost 33 years · 250 members · 2 factories</td><td>As above</td></tr>
  <tr><td>Company Basics — BHAG</td><td>Preferred choice by 2025</td><td>Date passed — reset required</td></tr>
  <tr><td>Hot / not-hot products and industries</td><td>2020-21</td><td>Refresh; the bowser exclusion now contradicts a live Rs. 187.50 Cr programme</td></tr>
  <tr><td>Sales team page</td><td>Current allocation</td><td>Add Neetu Sharan, Cdr Giri, Gen Mohandas; confirm coordination</td></tr>
  <tr><td>Values</td><td>Three different sets</td><td>Choose one and delete the others</td></tr>
  </table>
  <div class="note"><b>What is genuinely strong and should be protected</b>The engage ladder, the MAN and pre-call checklists, the BANTTC test, the problem-to-product table, the regret list, the weekly activity standard, the salesman manifesto, and the honesty of the weakness list. These are better than most manufacturers have. The playbook does not need rewriting — it needs its empty tables filled and its numbers corrected.</div>`},

 {id:"cu-board",kicker:"Verdict board",h2:"Where each account stands",
  html:`<table><tr><th>Account</th><th>Score</th><th>Verdict</th><th>Active thread</th><th>Owner</th></tr>
  <tr><td>KDAIL</td><td>7.6</td><td><span class="chip hot">Live</span></td><td>500-unit water bowser programme; Ankur Ashwin Shah, Rohit Shintre</td><td>Col. Acharya</td></tr>
  <tr><td>BDL</td><td>7.9</td><td><span class="chip go">Pursue</span></td><td>Introduction pathway via Gen Mohandas</td><td>Col. Acharya</td></tr>
  <tr><td>AIS</td><td>6.9</td><td><span class="chip go">Pursue</span></td><td>OEM glass supply, and MHE vendor for the Taloja greenfield</td><td><span class="chip tbc">Assign</span></td></tr>
  <tr><td>Exim Bank</td><td>—</td><td><span class="chip go">Pursue</span></td><td>Ubharte Sitaare as the priority route</td><td><span class="chip tbc">Assign</span></td></tr>
  <tr><td>Adani Defence · Cochin Shipyard · Elbit · Veda Aeronautics · Autoquip</td><td>—</td><td>Brief complete</td><td>No active thread</td><td><span class="chip tbc">None</span></td></tr>
  <tr><td>P&amp;MG</td><td>2.4</td><td><span class="chip" style="border-color:#F04E23;color:#F04E23">Do not engage</span></td><td>Closed. Integrity and compliance risk documented; NDA gap from factory tour flagged.</td><td>Closed</td></tr></table>
  <h3>KDAIL — the live programme</h3>
  <table><tr><th>Element</th><th>Position</th></tr>
  <tr><td>Scope</td><td>500 units · 5,000 L SS-316L insulated water bowser</td></tr>
  <tr><td>Platform</td><td>Ashok Leyland Stallion 4×4 — buyer-supplied, excluded from scope</td></tr>
  <tr><td>Our role</td><td>Tank system design, fabrication and integration</td></tr>
  <tr><td>Unit price</td><td>Rs. 37.50 lakh ex-works</td></tr>
  <tr><td>Design development · Type testing</td><td>Rs. 18 lakh · Rs. 75 lakh — both one-time, both separate</td></tr>
  <tr><td>Programme value ex-works</td><td>Rs. 187.50 Cr</td></tr>
  <tr><td>Payment</td><td>20% advance / 60% + full GST on delivery / 20% within 30 days <span class="chip tbc">Differs from the 20/30/40/10 standard — confirm as exception</span></td></tr>
  <tr><td>Ramp</td><td>5-unit proving batch at Month 4, then 20–35 per month</td></tr></table>
  <div class="note"><b>Two things this programme tells us</b>First, its structure is the right template for large repeat builds — one-time costs separated, buyer-supplied items excluded, proving batch before ramp. Second, at Rs. 187.50 Cr it is more than three times the one-year billing target of Rs. 60 Cr. If it converts, the OPSP numbers are not stretch targets — they are already out of date.</div>
  <div class="note"><b>Five briefs, no owner</b>Adani Defence, Cochin Shipyard, Elbit, Veda Aeronautics and Autoquip all have complete EVA briefs and no active thread. Research without follow-through is cost, not intelligence. Assign an owner and a next action, or move them to Watchlist and stop counting them.</div>`},

 {id:"cu-next",kicker:"Decisions",h2:"What unblocks the most",
  html:`<p class="lead">Almost everything below is blocked on a decision or an owner, not on capability. The work is largely done.</p>
  <h3>The seven decisions</h3>
  <ol>
   <li><b>Cascade the OPSP into sales targets.</b> Rs. 100 Cr at 10% PBT and Rs. 50 Cr exports are set. What is not set is how that splits by segment, by person and by quarter. Until it does, the OPSP is a company number rather than a sales plan.</li>
   <li><b>Map the meeting calendars.</b> The OPSP names twelve standing forums; the sales process names four. They overlap. Reconcile once so nobody attends two versions of the same meeting.</li>
   <li><b>Set price bands and delegated discount limits</b> per business line. This is the single mechanism that delivers the 3–5 year priority of Dr. Raghu at zero involvement in transactions. Until it exists, that priority is a wish.</li>
   <li><b>Assign an owner to the product master.</b> It closes a named weakness, a quarterly priority, section 12 of the playbook, and the quotation generator — all at once.</li>
   <li><b>Assign an owner to the installed-base register.</b> Without it, stage 12 of our own process cannot be executed and aftermarket revenue stays at zero.</li>
   <li><b>Approve the filled sections</b> — stage definitions, objection handling, negotiation policy — or mark them up. Drafts that sit unapproved are worse than blanks, because people half-follow them.</li>
   <li><b>Name the three export focus geographies</b>, the two anchor customers and the one flagship platform the Export Engine calls for. The platform is almost certainly the catering hi-lift; the rest is open.</li>
  </ol>
  <h3>Also open</h3>
  <table><tr><th>Initiative</th><th>Next action</th><th>Blocked on</th></tr>
  <tr><td>nandan.ch launch</td><td>Deploy</td><td><b>Dr. Raghu</b> — photograph, LinkedIn URL, 10 product images; then native DE/FR/IT review</td></tr>
  <tr><td>CopyLove brand programme</td><td>Brand guide delivery</td><td>Five factual errors corrected first — and the playbook corrections above feed the same sweep</td></tr>
  <tr><td>Template factual sweep</td><td>Correct every script and template</td><td>Owner not assigned. Half a day of work.</td></tr>
  <tr><td>Three D Integrated Solutions</td><td>EVA brief</td><td>AAI debarment creates a live tender gap — prioritise</td></tr>
  <tr><td>Eternalwin electric tuggers</td><td>CIF quote on the 10T ML-1000L</td><td>Supplier; factory audit under consideration</td></tr>
  <tr><td>Railway sector</td><td>Start outreach</td><td>877-company directory built; no owner, no plan</td></tr>
  <tr><td>Trade fairs</td><td>Decide participation</td><td><b>Dr. Raghu</b> — Eurosatory, Farnborough, GSE Expo Europe</td></tr>
  <tr><td>InstaFinancials database</td><td>Mine for targets</td><td>363 companies, 1,280 directors — currently an archive</td></tr>
  <tr><td>Lost quote analysis</td><td>Add "who won" field</td><td>Nothing. This can start Monday.</td></tr>
  </table>
  <div class="note"><b>Where Sales Regrow actually lands</b>Nandan does not have a sales knowledge problem. The 2023 process map, the engage ladder, the checklists and the activity standards are strong and were built with care. What is missing is the small number of decisions that turn a document into a system: one goal, one value set, price bands, and two owners. Four of those cost nothing but a decision.</div>`}
]}
];

const tabsEl=document.getElementById('tabs'),mainEl=document.getElementById('main'),subEl=document.getElementById('subnav');
let activeTab=0;
CONTENT.forEach((t,i)=>{
 const b=document.createElement('button');
 b.className='tab';b.textContent=t.tab;b.setAttribute('role','tab');
 b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=()=>selectTab(i);
 tabsEl.appendChild(b);
 const p=document.createElement('div');p.className='panel'+(i===0?' on':'');p.id='p-'+t.id;
 p.innerHTML=t.secs.map(s=>`<section class="sec" id="${s.id}"><span class="kicker">${s.kicker}</span><h2>${s.h2}</h2>${s.html}</section>`).join('');
 mainEl.appendChild(p);
});
function selectTab(i){
 activeTab=i;
 [...tabsEl.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i?'true':'false'));
 [...mainEl.children].forEach((p,j)=>p.classList.toggle('on',j===i));
 buildSubnav();window.scrollTo({top:0});
}
function buildSubnav(){
 subEl.innerHTML='<div class="eyebrow">In this section</div>';
 CONTENT[activeTab].secs.forEach((s,k)=>{
  const a=document.createElement('a');a.href='#'+s.id;a.textContent=s.h2;if(k===0)a.className='active';
  a.onclick=e=>{e.preventDefault();document.getElementById(s.id).scrollIntoView({block:'start'});markSub(k);};
  subEl.appendChild(a);
 });
}
function markSub(k){[...subEl.querySelectorAll('a')].forEach((a,j)=>a.classList.toggle('active',j===k));}
buildSubnav();
const spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
 const idx=CONTENT[activeTab].secs.findIndex(s=>s.id===e.target.id);if(idx>-1)markSub(idx);}});},
 {rootMargin:'-140px 0px -65% 0px'});
document.querySelectorAll('section.sec').forEach(s=>spy.observe(s));

/* ===== QUOTATION ENGINE ===== */
const $=id=>document.getElementById(id);
function inr(n){return 'Rs. '+Math.round(n).toLocaleString('en-IN');}
function words(n){if(n>=1e7)return '('+(n/1e7).toFixed(2)+' Cr)';if(n>=1e5)return '('+(n/1e5).toFixed(2)+' lakh)';return '';}
function num(id){const v=parseFloat($(id).value);return isNaN(v)?0:v;}
function quote(){
 const out=$('q_out');if(!out)return;
 const qty=Math.max(1,num('q_qty')),unit=num('q_unit'),disc=num('q_disc');
 const net=unit*(1-disc/100), goods=net*qty;
 const cost=num('q_cost'); const gm=(cost>0&&net>0)?((net-cost)/net*100):null;
 const dd=num('q_dd'),tt=num('q_tt'),tl=num('q_tool'),one=dd+tt+tl;
 const inco=$('q_inco').value, frt=inco==='Ex-works'?0:num('q_frt');
 const sub=goods+one+frt, gstR=num('q_gst'), gst=sub*gstR/100, tot=sub+gst;
 const p1=num('q_p1'),p2=num('q_p2'),p3=num('q_p3'),p4=num('q_p4'),psum=p1+p2+p3+p4;
 const pb=num('q_pb'),pm=num('q_pm'),rate=Math.max(1,num('q_rate'));
 const months=pb>=qty?pm:pm+Math.ceil((qty-pb)/rate);
 const val=num('q_val');
 const vd=new Date(Date.now()+val*864e5).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
 let f='';
 if(gm!==null&&gm<40)f+=`<div class="flag"><b>Gross margin ${gm.toFixed(1)}% — below the 40% Margin Fortress floor.</b> The OPSP enforces 40% at quote stage, not at review. This needs a deliberate, approved decision before the offer is issued.</div>`;
 if(gm!==null&&gm>=40)f+=`<div class="flag ok">Gross margin ${gm.toFixed(1)}% — clears the 40% floor.</div>`;
 if(cost===0)f+=`<div class="flag">Unit cost not entered, so margin cannot be checked against the 40% floor. Enter it, or confirm the margin separately.</div>`;
 if(sub>=5000000)f+=`<div class="flag">Value above Rs. 50 lakh — RJ approval required <b>in writing</b> before this offer is issued.</div>`;
 else if(sub>=1000000)f+=`<div class="flag">Value above Rs. 10 lakh — issue as a detailed proposal with three options, tell RJ, send a screenrec video on email and WhatsApp, and call after sending.</div>`;
 if(disc>0)f+=`<div class="flag">Discount of ${disc}% applied — Dr. Raghu's approval required before this offer is issued.</div>`;
 if(psum!==100)f+=`<div class="flag">Payment split totals ${psum}%. It must total 100%.</div>`;
 if(p1<20)f+=`<div class="flag">Advance below 20% — softer than the standard terms. Dr. Raghu sign-off required.</div>`;
 if($('q_bt').value!=='Yes')f+=`<div class="flag">BANTTC not revalidated. Playbook 7.1.9 requires revalidation before the quote is issued.</div>`;
 if($('q_cred').value!=='Cleared')f+=`<div class="flag">Credit position not cleared with Suresh Lalzare. Offers do not leave before this is done.</div>`;
 if($('q_ppc').value!=='Confirmed')f+=`<div class="flag">PPC slot not confirmed. Do not commit a delivery date Pankaj Sutar has not given you.</div>`;
 if(inco!=='Ex-works'&&frt===0)f+=`<div class="flag">${inco} selected with zero freight and insurance. Scope it explicitly or quote Ex-works.</div>`;
 if(!$('q_bsi').value.trim())f+=`<div class="flag">No buyer-supplied items named. If the customer supplies a chassis or major component, state it and exclude it.</div>`;
 if(one===0&&qty>=25)f+=`<div class="flag">Volume order with no design development or type testing quoted. Confirm these are genuinely not required — they are never absorbed into unit price.</div>`;
 if(!f)f='<div class="flag ok">All commercial rules satisfied. This offer can be issued by the opportunity owner.</div>';
 out.innerHTML=`
  <div class="qgsub">Offer summary</div>
  <div class="qline"><span>${$('q_line').value}${$('q_desc').value?' — '+$('q_desc').value.slice(0,70):''}</span><span></span></div>
  <div class="qline"><span>${qty} × ${inr(net)} ex-works${disc>0?' (after '+disc+'% discount)':''}</span><span>${inr(goods)}</span></div>
  ${dd?`<div class="qline"><span>Design development — one-time</span><span>${inr(dd)}</span></div>`:''}
  ${tt?`<div class="qline"><span>Type testing — one-time</span><span>${inr(tt)}</span></div>`:''}
  ${tl?`<div class="qline"><span>Tooling — one-time</span><span>${inr(tl)}</span></div>`:''}
  ${frt?`<div class="qline"><span>Freight &amp; insurance (${inco})</span><span>${inr(frt)}</span></div>`:''}
  <div class="qline"><span>Sub-total</span><span>${inr(sub)}</span></div>
  <div class="qline"><span>GST @ ${gstR}%</span><span>${inr(gst)}</span></div>
  <div class="qline tot"><span>Total</span><span>${inr(tot)}</span></div>
  <div class="words">${words(tot)}</div>
  <div class="qgsub">Payment milestones</div>
  <div class="qline"><span>${p1}% advance with order</span><span>${inr(tot*p1/100)}</span></div>
  <div class="qline"><span>${p2}% on GAD approval</span><span>${inr(tot*p2/100)}</span></div>
  <div class="qline"><span>${p3}% on delivery, incl. full GST</span><span>${inr(tot*p3/100)}</span></div>
  <div class="qline"><span>${p4}% on commissioning</span><span>${inr(tot*p4/100)}</span></div>
  <div class="qgsub">Delivery &amp; scope</div>
  <div class="qline"><span>Proving batch</span><span>${pb} units at Month ${pm}</span></div>
  <div class="qline"><span>Rate after ramp</span><span>${rate} units / month</span></div>
  <div class="qline"><span>Full quantity delivered by</span><span>Month ${months}</span></div>
  <div class="qline"><span>Incoterm</span><span>${inco}</span></div>
  <div class="qline"><span>Excluded — buyer supplied</span><span>${$('q_bsi').value.trim()||'None stated'}</span></div>
  <div class="qline"><span>Offer valid until</span><span>${vd}</span></div>
  <div class="qline"><span>Price variation</span><span>Applies on steel &amp; bought-out</span></div>
  ${gm!==null?`<div class="qline"><span>Gross margin at quote</span><span>${gm.toFixed(1)}% ${gm<40?"— BELOW FLOOR":"✓"}</span></div>`:''}
  <div class="qgsub">Compliance check</div>
  <div class="flagbox">${f}</div>`;
}
['q_cust','q_ref','q_line','q_val','q_desc','q_qty','q_unit','q_disc','q_cost','q_dd','q_tt','q_tool','q_inco','q_frt','q_gst','q_p1','q_p2','q_p3','q_p4','q_pb','q_pm','q_rate','q_bsi','q_bt','q_cred','q_ppc']
 .forEach(id=>{const el=$(id);if(el){el.addEventListener('input',quote);el.addEventListener('change',quote);}});
if($('q_ref'))$('q_ref').value='NGSE/Q/'+new Date().getFullYear()+'/____';
quote();

['copy','cut','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 e.preventDefault();return false;}));
document.addEventListener('keydown',e=>{
 const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
 const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&['s','p','u','c','x','a'].includes(k)){e.preventDefault();return false;}
 if(k==='f12'){e.preventDefault();return false;}
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].includes(k)){e.preventDefault();return false;}
});

window.addEventListener('blur',()=>shield.classList.add('on'));
